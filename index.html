<style>
:root{

  --info:#3A5F8A; --info-soft:#E1EAF5;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#151C19; --surface-2:#1B2420; --line:#2B3731; --line-2:#222C27;
  --ink:#E3EAE6; --ink-2:#B2C0B8; --muted:#84938B;
  --accent:#3CB99E; --accent-ink:#06201A; --accent-soft:#163A31; --accent-2:#7FD6C1;
  --ok:#4BC283; --ok-soft:#17352541; --warn:#E3A63C; --warn-soft:#3A2D1461; --crit:#F06A5A; --crit-soft:#43201B80;
  --info:#7FA6D6; --info-soft:#1C2A3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#151C19; --surface-2:#1B2420; --line:#2B3731; --line-2:#222C27;
  --ink:#E3EAE6; --ink-2:#B2C0B8; --muted:#84938B;

button,input,select,textarea{font:inherit;color:inherit}

<script>
/* ================= utilities ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const FA = '۰۱۲۳۴۵۶۷۸۹';
const toFa = s => String(s ?? '').replace(/\d/g, d => FA[d]);
const toEn = s => String(s ?? '').replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g, '.').replace(/[,،]/g, '');
const num = v => { const x = parseFloat(toEn(v)); return isFinite(x) ? x : 0; };
const fn = (n, d = 0) => (n == null || !isFinite(n)) ? '—' : Number(n).toLocaleString('fa-IR', { maximumFractionDigits: d });
const pct = (n, d = 0) => (n == null || !isFinite(n)) ? '—' : fn(n, d) + '٪';
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = (a, f = x => x) => a.reduce((s, x) => s + (f(x) || 0), 0);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

function normDate(s) {
  s = toEn(s).trim().replace(/[-.]/g, '/');
  const p = s.split('/').filter(Boolean).map(Number);
  if (p.length !== 3 || p.some(isNaN)) return null;
  let [y, m, d] = p;
  if (y < 100) y += 1400; else if (y < 1000) y += 1000;
  if (m < 1 || m > 12 || d < 1 || d > (m <= 6 ? 31 : 30)) return null;

VIEWS.dashboard = D => {
  const I = idx(), st = SET();
  const crit = D.alerts.filter(a => a.sev === 'crit').length, warn = D.alerts.filter(a => a.sev === 'warn').length;
  const wkActive = S.master.workers.filter(w => w.active !== false).length;
  const todayWorkers = new Set(D.todayRows.map(e => e.workerId)).size;
  const eff = D.mHrs ? D.mStd / D.mHrs * 100 : null;
  const ppm = (D.mGood + D.mScr) ? D.mScr / (D.mGood + D.mScr) * 1e6 : null;
  const openSO = Object.values(S.so).filter(s => s.status === 'open');
  const lateSO = openSO.filter(s => (s.qty - (D.soDel[s.id] || 0)) > 0 && s.dueDate && s.dueDate < TODAY).length;
  const kpis = `<div class="kpis">
    <div class="kpi ${D.planAch == null ? '' : D.planAch >= 90 ? 'ok' : D.planAch >= 70 ? 'warn' : 'crit'}"><span class="lbl">تحقق برنامه ${esc(monthLabel(S.month))}</span><span class="val">${D.planAch == null ? '—' : pct(D.planAch)}</span>${D.planAch == null ? `<span class="foot">${D.plan ? 'برنامه بدون محصول' : 'برنامه این ماه ثبت نشده'}</span>` : meter(D.planAch, D.planAch >= 90 ? 'ok' : D.planAch >= 70 ? 'warn' : 'crit') + `<span class="foot">بر اساس ساعت استاندارد محصولات</span>`}</div>
    <div class="kpi"><span class="lbl">گزارش‌های امروز</span><span class="val">${fn(todayWorkers)}<small> از ${fn(wkActive)} نفر</small></span><span class="foot">${fn(D.todayRows.length)} ردیف · ${fn(sum(D.todayRows, e => e.qty))} قطعه سالم</span></div>
    <div class="kpi ${eff == null ? '' : effSev(eff)}"><span class="lbl">بهره‌وری پرسنل (ماه)</span><span class="val">${eff == null ? '—' : pct(eff)}</span><span class="foot">${fn(D.mStd, 0)} ساعت استاندارد / ${fn(D.mHrs, 0)} ساعت حضور</span></div>
    <div class="kpi ${ppm == null ? '' : ppm > st.scrapWarnPpm ? 'crit' : ppm > st.scrapWarnPpm / 2 ? 'warn' : 'ok'}"><span class="lbl">ضایعات ماه</span><span class="val">${ppm == null ? '—' : fn(ppm)}<small> ppm</small></span><span class="foot">${fn(D.mScr)} ضایعات · ${fn(D.mRw)} دوباره‌کاری</span></div>
    <div class="kpi ${lateSO ? 'crit' : ''}"><span class="lbl">سفارش‌های باز مشتری</span><span class="val">${fn(openSO.length)}</span><span class="foot">${lateSO ? fn(lateSO) + ' سفارش معوق' : 'بدون سفارش معوق'}</span></div>
  </div>`;

  const alerts = card('هشدارهای کنترلی', `${fn(crit)} بحرانی · ${fn(warn)} هشدار`,
    `<div class="alerts">${D.alerts.length ? D.alerts.slice(0, 14).map(a => `<div class="alert ${a.sev}"><i class="bar"></i><div><span class="area">${esc(a.area)}</span><b>${esc(a.title)}</b><span>${esc(a.detail)}</span></div><a class="btn sm ghost" href="#${a.link}">بررسی</a></div>`).join('') + (D.alerts.length > 14 ? `<div class="empty">و ${fn(D.alerts.length - 14)} مورد دیگر — در بخش مربوط ببینید.</div>` : '') : '<div class="empty"><b>همه چیز در محدوده مجاز است</b>هیچ قاعده کنترلی نقض نشده.</div>'}</div>`);

  // mini flow
  const rows = activeProducts().filter(p => (p._lines || []).some(L => L.stages?.length)).map(p => {
    const main = p.stages || [];
    const segs = (p.kind === 'assembly' ? p._lines.flatMap(L => L.stages) : main).map(s => {
      const w = D.wip[s.id]; const m = D.stg[s.id]?.mOut || 0;
      const cls = w != null && w < 0 ? 'bad' : (w || 0) > 0 && (w || 0) >= Math.max(...Object.values(D.wip).filter(x => x > 0), 1) * 0.6 ? 'hot' : m ? 'act' : '';
      return `<div class="mf-seg ${cls}" title="${esc(s.name)} — تولید ماه ${fn(m)} · در انتظار بعد: ${w == null ? '—' : fn(w)}"><i></i><em>${w ? fn(w) : ''}</em></div>`;
    }).join('');
    return `<div class="mf-row"><div class="pn">${esc(p.name)}<small>${p.kind === 'assembly' ? 'مونتاژی' : 'خطی'} · ${fn(p._lines.reduce((a, L) => a + (L.stages?.length || 0), 0))} مرحله</small></div><div class="mf-track">${segs}</div><div class="mf-fg"><b>${fn(D.fg[p.id]?.stock)}</b>موجودی محصول</div></div>`;
  }).join('');
  const flow = card('قطعات در مراحل تولید', 'عدد زیر هر مرحله: قطعه در انتظار مرحله بعد', `<div class="mini-flow">${rows}</div><div class="card-b legend"><span><i style="background:var(--accent)"></i>فعال این ماه</span><span><i style="background:var(--warn)"></i>انباشت زیاد (گلوگاه)</span><span><i style="background:var(--crit)"></i>گزارش ناسازگار</span></div>`, `<a class="btn sm" href="#flow">نمای کامل</a>`);

  // materials coverage
  const mats = S.master.materials.filter(m => m.active !== false && m.perProduct && !m.isScrap).map(m => ({ m, x: D.mat[m.id] })).sort((a, b) => (a.x.cover / (a.m.reorderProducts || 1)) - (b.x.cover / (b.m.reorderProducts || 1)));
  const matBars = mats.slice(0, 9).map(({ m, x }) => {
    const max = Math.max(m.maxProducts || 0, m.reorderProducts * 2, x.cover || 0, 1);
    return `<div class="barrow"><span class="nm" title="${esc(m.name)}">${esc(m.name)}</span><div class="track ${x.status}"><i style="width:${clamp((x.cover || 0) / max * 100, 0, 100)}%"></i><span class="mark" style="inset-inline-start:${clamp(m.reorderProducts / max * 100, 0, 100)}%"></span></div><span class="v">${fn(x.cover)} ${esc(I.prod[m.productId]?.name || '')}</span></div>`;
  }).join('');
  const matCard = card('پوشش مواد اولیه', 'تعداد محصول قابل ساخت · خط: نقطه سفارش', `<div class="card-b bars">${matBars || '<div class="empty">ماده‌ای تعریف نشده</div>'}</div>`, `<a class="btn sm" href="#materials">انبار</a>`);

  // equipment
  const dies = (S.master.equipment.dies || []).map(d => ({ d, x: D.die[d.id] }));
  const eqBars = dies.map(({ d, x }) => `<div class="barrow"><span class="nm" title="${esc(d.name)}">${esc(d.name)}</span><div class="track ${x.status === 'unknown' ? '' : x.status}"><i style="width:${x.status === 'unknown' ? 0 : clamp(x.pmPct, 0, 100)}%"></i></div><span class="v">${x.status === 'unknown' ? 'PM ثبت نشده' : fn(x.since) + ' / ' + fn(d.pmEvery)}</span></div>`).join('')
    + (S.master.equipment.presses || []).filter(p => D.press[p.id].status !== 'unknown').map(p => { const x = D.press[p.id]; return `<div class="barrow"><span class="nm">${esc(p.name)}</span><div class="track ${x.status}"><i style="width:${clamp(x.since / p.pmEveryDays * 100, 0, 100)}%"></i></div><span class="v">${fn(x.since)} / ${fn(p.pmEveryDays)} روز</span></div>`; }).join('');
  const eqCard = card('نگهداری پرس و قالب', 'ضرب از آخرین PM نسبت به تناوب', `<div class="card-b bars">${eqBars || '<div class="empty">قالبی تعریف نشده</div>'}</div>`, `<a class="btn sm" href="#equipment">جزئیات</a>`);

  // daily chart
  const dim = daysInMonth(S.month); const vals = Array.from({ length: dim }, (_, i) => D.daily[`${S.month.replace('-', '/')}/${pad(i + 1)}`] || 0);
  const mx = Math.max(...vals, 1); const W = 620, H = 150, pl = 34, pb = 20, bw = (W - pl - 6) / dim;
  const ticks = [0, mx / 2, mx];
  const chart = `<div class="chart card-b"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ساعت استاندارد تولید روزانه">
    ${ticks.map(t => { const y = H - pb - (t / mx) * (H - pb - 10); return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line-2)"/><text x="${pl - 6}" y="${y + 3}" text-anchor="end">${fn(t)}</text>`; }).join('')}
    ${vals.map((v, i) => { const h = (v / mx) * (H - pb - 10); const x = W - 6 - (i + 1) * bw + 2; return `<rect x="${x}" y="${H - pb - h}" width="${Math.max(bw - 3, 2)}" height="${Math.max(h, v ? 1 : 0)}" rx="2" fill="${`${S.month.replace('-', '/')}/${pad(i + 1)}` === TODAY ? 'var(--warn)' : 'var(--accent)'}"/>${(i + 1) % 5 === 0 || i === 0 ? `<text x="${x + bw / 2 - 1}" y="${H - 5}" text-anchor="middle">${toFa(i + 1)}</text>` : ''}`; }).join('')}
  </svg></div>`;
  const chartCard = card('کارکرد روزانه', 'ساعت استاندارد تولید شده در هر روز ' + esc(monthLabel(S.month)), D.mStd ? chart : `<div class="empty"><b>برای ${esc(monthLabel(S.month))} گزارشی ثبت نشده</b>با «+ گزارش روزانه» اولین گزارش را ثبت کنید.</div>`);

  // orders + suppliers
  const soList = Object.values(S.so).filter(s => s.status === 'open').sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || '')).slice(0, 6);
  const soCard = card('سفارش‌های باز', '', soList.length ? `<div class="tbl-wrap"><table><thead><tr><th>محصول</th><th>مشتری</th><th>موعد</th><th class="n">پیشرفت</th></tr></thead><tbody>${soList.map(s => { const d = D.soDel[s.id] || 0; const p = s.qty ? d / s.qty * 100 : 0; const late = s.dueDate < TODAY && d < s.qty; return `<tr><td>${esc(I.prod[s.productId]?.name)}</td><td>${esc(s.customer)}</td><td>${fd(s.dueDate)} ${late ? pill('crit', 'معوق') : ''}</td><td class="n">${fn(d)} / ${fn(s.qty)} <span class="mini-bar ${late ? 'crit' : 'ok'}"><i style="width:${clamp(p, 0, 100)}%"></i></span></td></tr>`; }).join('')}</tbody></table></div>` : `<div class="empty"><b>سفارش بازی ثبت نشده</b>سفارش‌های ماهانه مشتری را در «سفارش و تحویل مشتری» وارد کنید.</div>`, `<a class="btn sm" href="#orders">همه</a>`);
  const sups = S.master.suppliers.map(s => ({ s, x: D.sup[s.id] })).filter(o => o.x.score != null).sort((a, b) => b.x.score - a.x.score);
  const supCard = card('رتبه تامین‌کنندگان', 'میانگین امتیاز محموله‌ها', `<div class="card-b bars">${sups.map(({ s, x }) => `<div class="barrow"><span class="nm">${esc(s.name)}</span><div class="track ${x.score >= 90 ? 'ok' : x.score >= SET().supplierWarn ? 'warn' : 'crit'}"><i style="width:${x.score}%"></i></div><span class="v">${fn(x.score, 1)}</span></div>`).join('') || '<div class="empty">امتیازی ثبت نشده</div>'}</div>`, `<a class="btn sm" href="#purchase">خرید</a>`);

  // activity feed
  const feed = [
    ...entriesOf('ledger_prod').map(e => ({ d: e.date, t: e.ts || 0, txt: `${esc(I.wk[e.workerId]?.name || '')}: ${fn(e.qty)} قطعه — ${esc(stageLabel(e.stageId))}` })),
    ...entriesOf('ledger_fg').map(e => ({ d: e.date, t: e.ts || 0, txt: `${e.type === 'out' ? 'تحویل' : e.type === 'in' ? 'ورود به انبار' : 'اصلاح'} ${fn(e.qty)} ${esc(I.prod[e.productId]?.name || '')}${e.customer ? ' به ' + esc(e.customer) : ''}` })),
    ...entriesOf('ledger_eq').filter(e => e.type !== 'run').map(e => ({ d: e.date, t: e.ts || 0, txt: `${e.type === 'pm' ? 'PM' : 'تعمیر'} ${esc(I.die[e.dieId]?.name || I.press[e.pressId]?.name || '')}${e.note ? ' — ' + esc(e.note) : ''}` })),
    ...Object.values(S.po).flatMap(po => (po.receipts || []).map(r => ({ d: r.date, t: r.ts || 0, txt: `رسید ${fn(r.qty, 1)} ${esc(I.mat[po.materialId]?.unit || '')} ${esc(I.mat[po.materialId]?.name || po.materialLabel || '')} از ${esc(I.sup[po.supplierId]?.name || '')}` }))),
  ].filter(x => x.d).sort((a, b) => b.d.localeCompare(a.d) || b.t - a.t).slice(0, 9);
  const feedCard = card('آخرین رویدادها', '', `<div class="feed-list">${feed.map(f => `<div class="feed-item"><time>${fd(f.d)}</time><span>${f.txt}</span></div>`).join('') || '<div class="empty">رویدادی ثبت نشده</div>'}</div>`);

  return `${kpis}
  <div class="grid g-dash">${alerts}<div class="grid">${flow}${chartCard}</div></div>
  <div class="grid g3">${matCard}${eqCard}${supCard}</div>
  <div class="grid g2">${soCard}${feedCard}</div>`;
};

/* ---------- production flow ---------- */
VIEWS.flow = D => {
  const I = idx();
  const allW = Object.values(D.wip).filter(x => x > 0); const hot = allW.length ? Math.max(...allW) * 0.6 : Infinity;
  const stageBox = s => {
    const x = D.stg[s.id] || {}; const w = D.wip[s.id];
    const die = s.dieId ? I.die[s.dieId] : null;
    const cls = w != null && w < 0 ? 'bad' : '';
    return `<div class="stg-box ${cls}"><span class="nm" title="${esc(s.name)}">${esc(s.name)}</span><span class="mc">${esc(die ? die.name : s.machine || '—')}</span><span class="out"><b>${fn(x.mOut || 0)}</b> <span class="muted">این ماه</span></span><span class="mc">کل: ${fn(x.out || 0)}${x.mScr ? ' · ضایعات ' + fn(x.mScr) : ''}</span></div>`;
  };
  const wipChip = w => w == null ? '' : `<span class="wip ${w < 0 ? 'bad' : w === 0 ? 'z' : w >= hot ? 'hot' : ''}" title="قطعه در انتظار مرحله بعد">${fn(w)}</span>`;
  const cards = activeProducts().map(p => {
    const lines = (p._lines || []).filter(L => L.stages?.length);
    if (!lines.length) return card(esc(p.name), 'مسیر تولید تعریف نشده', `<div class="empty">برای این محصول مرحله‌ای تعریف نشده است. <a href="#settings">تعریف مسیر</a></div>`);
    const body = lines.map(L => {
      const st = L.stages.map((s, i) => `<div class="stg">${stageBox(s)}</div>${i < L.stages.length - 1 || L.kind === 'comp' ? `<div class="arrow">${wipChip(D.wip[s.id])}</div>` : ''}`).join('');
      const feed = L.kind === 'comp' ? `<div class="feed">← ${esc(I.stage[L.feedsInto]?.name || '؟')} (${fn(L.perUnit)} عدد در هر ${esc(p.name)})</div>` : '';
      const tail = L.kind === 'main' ? `<span class="fg-chip">انبار محصول: ${fn(D.fg[p.id]?.stock)}</span>` : '';
      return `<div class="line"><div class="line-h"><b>${esc(L.name)}</b><small>${L.kind === 'comp' ? 'زیرمونتاژ · ×' + toFa(L.perUnit) : p.kind === 'assembly' ? 'پس از مونتاژ' : 'مسیر خطی'}</small>${feed}</div><div class="stages">${st}${tail}</div></div>`;
    }).join('');
    const wipTotal = sum(Object.entries(D.wip).filter(([k, v]) => I.stage[k]?.product.id === p.id && v > 0), ([, v]) => v);
    return card(esc(p.name), `${p.kind === 'assembly' ? 'محصول مونتاژی' : 'محصول خطی'} · ${esc(p.customer || '')} · کل قطعات در جریان: ${fn(wipTotal)}`, `<div class="flow-product">${body}</div>`, `<button class="btn sm" data-act="newReport" data-p="${p.id}">ثبت گزارش</button>`);
  }).join('');
  return `<div class="page-intro"><p>هر کادر یک مرحله تولید است با تعداد تولید ماه جاری. عدد روی فلش‌ها قطعاتی است که مرحله قبل تحویل داده و هنوز وارد مرحله بعد نشده (کار در جریان). در محصولات مونتاژی، زیرمونتاژها با ضریب مصرف به مرحله مونتاژ یا جوش تغذیه می‌شوند.</p></div>
  ${D.prodCount ? '' : `<div class="note">هنوز گزارش روزانه‌ای ثبت نشده؛ اعداد با اولین گزارش‌ها پر می‌شوند. آمار خرداد ۱۴۰۵ منتقل‌شده از اکسل در «برنامه ماهانه» (ماه خرداد) قابل مشاهده است.</div>`}
  ${cards}`;
};

/* ---------- daily reports ---------- */
VIEWS.reports = D => {
  const I = idx(), f = S.f;
  let rows = monthEntries('ledger_prod', S.month).slice();
  if (f.worker) rows = rows.filter(e => e.workerId === f.worker);
  if (f.product) rows = rows.filter(e => I.stage[e.stageId]?.product.id === f.product);
  rows.sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  const byDate = {}; rows.forEach(e => (byDate[e.date] || (byDate[e.date] = [])).push(e));
  const body = Object.entries(byDate).map(([d, list]) => `<tr class="group"><td colspan="9">${fd(d)} — ${fn(new Set(list.map(e => e.workerId)).size)} نفر · ${fn(sum(list, e => e.qty))} قطعه · ${fn(sum(list, e => e.hours), 1)} ساعت</td></tr>` + list.map(e => {
    const s = I.stage[e.stageId]; const std = (e.qty || 0) * (s?.stdMin || 0) / 60; const eff = e.hours ? std / e.hours * 100 : null;
    return `<tr><td>${esc(I.wk[e.workerId]?.name || '؟')}</td><td>${esc(s?.product.name || '؟')}</td><td>${esc(s ? (s.line.kind === 'comp' ? s.line.name + ' › ' : '') + s.name : '؟')}</td><td class="n">${fn(e.qty)}</td><td class="n">${fn(e.rework)}</td><td class="n">${e.scrap ? `<b style="color:var(--crit)">${fn(e.scrap)}</b>` : '۰'}</td><td class="n">${fn(e.hours, 1)}</td><td class="n">${eff == null ? '—' : pill(effSev(eff), pct(eff))}</td><td class="n no-print"><button class="btn sm ghost" data-act="editReport" data-id="${e.id}">ویرایش</button><button class="btn sm ghost danger" data-act="delEntry" data-k="ledger_prod" data-m="${S.month}" data-id="${e.id}">حذف</button></td></tr>`;
  }).join('')).join('');
  const tools = `<select id="fWorker" data-f="worker" style="width:auto">${selOpts(S.master.workers, f.worker, 'همه پرسنل')}</select><select id="fProduct" data-f="product" style="width:auto">${selOpts(activeProducts(), f.product, 'همه محصولات')}</select>${S.downloads ? `<button class="btn sm" data-act="csvReports">خروجی CSV</button>` : ''}`;
  return `<div class="page-intro"><p>هر کارگر در پایان شیفت برای هر مرحله‌ای که کار کرده، تعداد سالم، دوباره‌کاری، ضایعات و ساعت کار را ثبت می‌کند. همین گزارش‌ها موجودی بین مراحل، مصرف مواد، شمارش ضرب قالب و بهره‌وری را خودکار به‌روز می‌کنند.</p><span class="sp"></span><button class="btn pri" data-act="newReport">+ ثبت گزارش روزانه</button></div>
  ${card('گزارش‌های ' + esc(monthLabel(S.month)), `${fn(rows.length)} ردیف`, rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>کارگر</th><th>محصول</th><th>مرحله</th><th class="n">سالم</th><th class="n">دوباره‌کاری</th><th class="n">ضایعات</th><th class="n">ساعت</th><th class="n">بهره‌وری</th><th class="no-print"></th></tr></thead><tbody>${body}</tbody></table></div>` : `<div class="empty"><b>گزارشی برای این ماه ثبت نشده</b>ماه را از بالای صفحه تغییر دهید یا گزارش جدید ثبت کنید.</div>`, tools)}`;
};
/* ---------- monthly plan ---------- */
VIEWS.plan = D => {
  const I = idx(), P = D.plan;
  if (!P) return `<div class="page-intro"><p>برنامه ماهانه تعداد محصول نهایی هر محصول را مشخص می‌کند. سامانه نیاز هر مرحله (با ضریب زیرمونتاژ)، ساعت‌نفر لازم و درصد تحقق را از گزارش‌های روزانه حساب می‌کند.</p></div>
    ${card('برنامه ' + esc(monthLabel(S.month)), '', `<div class="empty"><b>برای این ماه برنامه‌ای ثبت نشده</b><br><button class="btn pri" data-act="editPlan">ثبت برنامه ${esc(monthLabel(S.month))}</button></div>`)}`;
  const cap = (P.staff || 0) * (P.workDays || 0) * (P.dayHours || 0);
  const reqRows = [];
  (P.items || []).forEach(it => {
    const p = I.prod[it.productId]; if (!p) return;
    (p._lines || []).forEach(L => (L.stages || []).forEach(s => {
      const need = it.qty * (L.perUnit || 1);
      const imp = P.importedStages?.[s.id];
      const act = (D.stg[s.id]?.mOut || 0) || (imp?.actual || 0);
      reqRows.push({ p, L, s, need, act, hrs: need * (s.stdMin || 0) / 60, imp: !D.stg[s.id]?.mOut && imp });
    }));
  });
  const reqH = sum(reqRows, r => r.hrs);
  const loadSev = !cap ? 'unknown' : reqH > cap ? 'crit' : reqH > cap * 0.9 ? 'warn' : 'ok';
  const top = `<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">

let MODAL = null;
function openModal({ title, body, submit = 'ثبت', onSubmit, foot = '', onMount, wide }) {
  MODAL = { onSubmit, onMount };
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = `<div class="err" id="mErr" hidden></div>` + body;
  $('#mFoot').innerHTML = (onSubmit ? `<button type="submit" class="btn pri" id="mSubmit">${esc(submit)}</button>` : '') + `<button type="button" class="btn" data-act="closeModal">${onSubmit ? 'انصراف' : 'بستن'}</button><span style="flex:1"></span>${foot}`;
  const dlg = $('#modal'); dlg.style.width = wide ? 'min(1040px,calc(100vw - 24px))' : '';
  if (!dlg.open) dlg.showModal();
  onMount && onMount($('#mBody'));
  setTimeout(() => { const f = $('#mBody').querySelector('input:not([type=hidden]),select'); f && f.focus(); }, 30);
}
function closeModal() { const d = $('#modal'); if (d.open) d.close(); MODAL = null; }
function mErr(msg) { const e = $('#mErr'); e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: 'nearest' }); }
$('#mform').addEventListener('submit', async ev => {
  ev.preventDefault();
  if (!MODAL?.onSubmit) return;
  const btn = $('#mSubmit'); btn.disabled = true; $('#mErr').hidden = true;
  try { const msg = await MODAL.onSubmit(new FormData($('#mform')), $('#mBody')); closeModal(); toast(msg || 'ثبت شد'); }
  catch (e) { mErr(typeof e === 'string' ? e : (e?.message || 'ثبت انجام نشد')); btn.disabled = false; }
});
$('#modal').addEventListener('cancel', () => { MODAL = null; });
const fv = (fd, k) => (fd.get(k) ?? '').toString().trim();
const fnum = (fd, k) => num(fd.get(k));
function needDate(fd, k = 'date') { const d = normDate(fv(fd, k)); if (!d) throw 'تاریخ را به شکل ۱۴۰۵/۰۶/۲۰ وارد کنید.'; return d; }
const F = (label, inner, hint) => `<div class="field"><label>${label}</label>${inner}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
const inp = (name, val = '', attrs = '') => `<input type="text" id="f_${name}" name="${name}" value="${esc(val)}" ${attrs}>`;
const ninp = (name, val = '', attrs = '') => `<input type="text" inputmode="decimal" id="f_${name}" name="${name}" value="${val === '' || val == null ? '' : esc(val)}" ${attrs}>`;
const dinp = (name, val = TODAY) => `<input type="text" inputmode="numeric" id="f_${name}" name="${name}" value="${esc(val || '')}" placeholder="۱۴۰۵/۰۶/۲۰" dir="ltr" style="text-align:right">`;

let ROWN = 0;
function openReport(preset = {}, edit = null) {
  ROWN = 1;
  const workers = S.master.workers.filter(w => w.active !== false || (edit && w.id === edit.workerId));
  openModal({
    title: edit ? 'ویرایش گزارش' : 'ثبت گزارش روزانه کارگر', submit: edit ? 'ذخیره تغییرات' : 'ثبت گزارش', wide: true,
    body: `<div class="fgrid">${F('تاریخ', dinp('date', edit?.date || TODAY))}${F('نام کارگر', sel('worker', selOpts(workers, edit?.workerId || preset.workerId, 'انتخاب…')))}${F('توضیح', inp('note', edit?.note || ''))}</div>
      <div class="rows" id="rrows">${reportRow(0, edit ? { ...edit, productId: idx().stage[edit.stageId]?.product.id } : { productId: preset.productId })}</div>
      ${edit ? '' : `<div><button type="button" class="btn sm" data-act="addRow">+ مرحله دیگر برای همین کارگر</button></div>`}
      <div class="note">ضایعات = قطعه‌ای که دور ریخته می‌شود (از مرحله قبل مصرف شده ولی خروجی سالم ندارد). دوباره‌کاری = قطعه‌ای که اصلاح و سالم شد.</div>`,
    onSubmit: async fd => {
      const date = needDate(fd); const workerId = fv(fd, 'worker'); if (!workerId) throw 'نام کارگر را انتخاب کنید.';
      const rows = [];
      $$('#rrows .rrow').forEach(el => {
        const i = el.dataset.row; const stageId = fv(fd, 's_' + i); const qty = fnum(fd, 'q_' + i), rework = fnum(fd, 'rw_' + i), scrap = fnum(fd, 'sc_' + i), hours = fnum(fd, 'h_' + i);
        if (!stageId && !qty && !hours) return;
        if (!stageId) throw 'برای هر ردیف مرحله تولید را انتخاب کنید.';
        if (qty < 0 || scrap < 0 || rework < 0 || hours < 0) throw 'اعداد نمی‌توانند منفی باشند.';
        if (!qty && !scrap && !rework) throw 'تعداد تولید را وارد کنید.';
        if (hours > 24) throw 'ساعت کار در یک ردیف بیش از ۲۴ است.';
        rows.push({ id: edit?.id || uid(), ts: Date.now(), date, workerId, stageId, qty, rework, scrap, hours, note: fv(fd, 'note') });
      });
      if (!rows.length) throw 'حداقل یک ردیف تولید وارد کنید.';
      const tot = sum(rows, r => r.hours); if (tot > 16) throw 'جمع ساعت کار این کارگر بیش از ۱۶ ساعت است.';
      if (edit) { await replaceLedger('ledger_prod', monthOf(edit.date), rows[0]); return 'گزارش ویرایش شد'; }
      await appendLedger('ledger_prod', date, rows);
      if (monthOf(date) !== S.month) S.month = monthOf(date);
      return `گزارش ${rows.length > 1 ? toFa(rows.length) + ' مرحله ' : ''}ثبت شد`;
    }
  });
}

function openRules() {
  const s = SET();
  const R = [['pmWarnPct', 'هشدار PM قالب/پرس (٪ تناوب)'], ['lifeWarnPct', 'هشدار عمر قالب (٪)'], ['prodWarnPct', 'حد بهره‌وری پرسنل (٪)'], ['scrapWarnPpm', 'حد ضایعات مرحله (ppm)'], ['supplierWarn', 'حد امتیاز تامین‌کننده'], ['soWarnDays', 'هشدار سفارش مشتری (روز مانده)'], ['poLateCritDays', 'دیرکرد بحرانی خرید (روز)'], ['planLagPct', 'عقب‌ماندگی مجاز از برنامه (٪)']];
  openModal({ title: 'آستانه‌های قواعد کنترلی', body: `<div class="fgrid">${R.map(([k, l]) => F(l, ninp(k, s[k]))).join('')}</div><label class="inline"><input type="checkbox" name="auto" id="f_auto" ${s.autoConsume ? 'checked' : ''}> کسر خودکار مصرف مواد از گزارش روزانه</label>`,
    onSubmit: async fd => { const o = Object.fromEntries(R.map(([k]) => [k, fnum(fd, k)])); o.autoConsume = fd.get('auto') === 'on'; await mutate('master/settings', d => ({ ...d, ...o })); return 'آستانه‌ها ذخیره شد'; } });
}

/* ---------- product & routing editor ---------- */
let RE = null;
function openProduct(id) {
  const p = id ? idx().prod[id] : null;
  RE = p ? JSON.parse(JSON.stringify({ id: p.id, name: p.name, code: p.code, customer: p.customer, kind: p.kind, components: p.components || [], stages: p.stages || [], fgOpening: p.fgOpening || 0, fgOpeningDate: p.fgOpeningDate || TODAY, monthlyForecast: p.monthlyForecast || 0, minStock: p.minStock || 0, active: p.active !== false })) : { id: 'p_' + uid(), name: '', code: '', customer: '', kind: 'linear', components: [], stages: [], fgOpening: 0, fgOpeningDate: TODAY, monthlyForecast: 0, minStock: 0, active: true, _new: true };
  openModal({ title: p ? 'مسیر تولید ' + p.name : 'محصول جدید', wide: true, body: `<div id="reBody">${reHtml()}</div>`, submit: 'ذخیره محصول',
    onSubmit: async () => {
      reSync(); if (!RE.name) throw 'نام محصول را وارد کنید.';
      const all = [...RE.components.flatMap(c => c.stages), ...RE.stages]; if (all.some(s => !s.name)) throw 'نام همه مراحل را وارد کنید.';
      if (RE.kind === 'assembly' && RE.components.some(c => !c.feedsInto)) throw 'برای هر زیرمونتاژ مرحله مصرف‌کننده را انتخاب کنید.';
      const out = { ...RE }; delete out._new; if (out.kind === 'linear') out.components = [];
      await upsertMaster('products', out); return 'محصول ذخیره شد';
    } });
}
function stageRowHtml(path, s, i) {
  return `<div class="srow" data-path="${path}.${i}"><span class="muted">${toFa(i + 1)}</span><input type="text" data-k="name" value="${esc(s.name)}" placeholder="نام مرحله" aria-label="نام مرحله"><input type="text" data-k="stdMin" value="${esc(s.stdMin ?? '')}" placeholder="دقیقه" title="زمان استاندارد (نفر-دقیقه برای یک قطعه)" inputmode="decimal"><input type="text" data-k="machine" value="${esc(s.machine || '')}" placeholder="دستگاه"><select data-k="dieId" title="قالب (برای شمارش ضرب)">${selOpts(S.master.equipment.dies || [], s.dieId, 'بدون قالب')}</select><input type="text" data-k="openingWip" value="${esc(s.openingWip || 0)}" title="کار در جریان اول دوره" inputmode="numeric"><span class="inline" style="gap:2px"><button type="button" class="btn sm ghost" data-act="reMove" data-path="${path}" data-i="${i}" data-d="-1" title="انتقال به قبل">▲</button><button type="button" class="btn sm ghost danger" data-act="reDel" data-path="${path}" data-i="${i}" title="حذف مرحله">✕</button></span></div>`;
}
function reHtml() {
  const stagesHdr = `<div class="srow small muted"><span>#</span><span>مرحله</span><span>زمان استاندارد</span><span>دستگاه</span><span>قالب</span><span>WIP اول</span><span></span></div>`;
  const feedOpts = sel => [...RE.components.flatMap(c => c.stages.map(s => ({ id: s.id, name: c.name + ' › ' + s.name }))), ...RE.stages.map(s => ({ id: s.id, name: s.name }))].map(o => `<option value="${o.id}" ${o.id === sel ? 'selected' : ''}>${esc(o.name)}</option>`).join('');
  return `<div class="fgrid">${F('نام محصول', `<input type="text" data-top="name" value="${esc(RE.name)}">`)}${F('کد', `<input type="text" data-top="code" value="${esc(RE.code || '')}">`)}${F('مشتری', `<input type="text" data-top="customer" value="${esc(RE.customer || '')}">`)}${F('نوع', `<select data-top="kind"><option value="linear" ${RE.kind === 'linear' ? 'selected' : ''}>خطی (مراحل پشت سر هم)</option><option value="assembly" ${RE.kind === 'assembly' ? 'selected' : ''}>مونتاژی (چند زیرمونتاژ)</option></select>`)}</div>
  <div class="fgrid">${F('موجودی اول دوره', `<input type="text" data-top="fgOpening" value="${esc(RE.fgOpening)}">`)}${F('پیش‌بینی فروش ماهانه', `<input type="text" data-top="monthlyForecast" value="${esc(RE.monthlyForecast)}">`)}${F('حداقل موجودی', `<input type="text" data-top="minStock" value="${esc(RE.minStock)}">`)}${F('وضعیت', `<select data-top="active"><option value="1">فعال</option><option value="0" ${RE.active ? '' : 'selected'}>غیرفعال</option></select>`)}</div>
  <div class="route-edit">
    ${RE.kind === 'assembly' ? RE.components.map((c, ci) => `<div class="route-line" data-comp="${ci}"><div class="inline"><b>زیرمونتاژ</b><input type="text" data-ck="name" value="${esc(c.name)}" style="width:170px" aria-label="نام زیرمونتاژ"><label class="small">تعداد در هر محصول</label><input type="text" data-ck="perUnit" value="${esc(c.perUnit)}" style="width:70px"><label class="small">مصرف در مرحله</label><select data-ck="feedsInto" style="width:auto">${feedOpts(c.feedsInto)}</select><span style="flex:1"></span><button type="button" class="btn sm ghost danger" data-act="reDelComp" data-i="${ci}">حذف زیرمونتاژ</button></div>${stagesHdr}${c.stages.map((s, i) => stageRowHtml('c' + ci, s, i)).join('')}<div><button type="button" class="btn sm" data-act="reAdd" data-path="c${ci}">+ مرحله</button></div></div>`).join('') + `<div><button type="button" class="btn sm" data-act="reAddComp">+ زیرمونتاژ</button></div>` : ''}
    <div class="route-line"><b>${RE.kind === 'assembly' ? 'خط مونتاژ نهایی (از مونتاژ تا بسته‌بندی)' : 'مراحل تولید به ترتیب'}</b>${stagesHdr}${RE.stages.map((s, i) => stageRowHtml('m', s, i)).join('')}<div><button type="button" class="btn sm" data-act="reAdd" data-path="m">+ مرحله</button></div></div>
  </div>
  <div class="note">زمان استاندارد = نفر-دقیقه لازم برای یک قطعه در آن مرحله (همان ستون «زمان تولید یک قطعه» در فایل برنامه‌ریزی). آخرین مرحله خط اصلی، محصول را وارد انبار محصول می‌کند.</div>`;
}
function reSync() {
  const b = $('#reBody'); if (!b || !RE) return;
  b.querySelectorAll('[data-top]').forEach(el => { const k = el.dataset.top; let v = el.value; if (['fgOpening', 'monthlyForecast', 'minStock'].includes(k)) v = num(v); if (k === 'active') v = v === '1'; RE[k] = v; });
  b.querySelectorAll('[data-comp]').forEach(el => { const c = RE.components[+el.dataset.comp]; el.querySelectorAll('[data-ck]').forEach(i => { c[i.dataset.ck] = i.dataset.ck === 'perUnit' ? num(i.value) || 1 : i.value; }); });
  b.querySelectorAll('.srow[data-path]').forEach(el => { const [path, i] = el.dataset.path.split('.'); const arr = path === 'm' ? RE.stages : RE.components[+path.slice(1)].stages; const s = arr[+i]; el.querySelectorAll('[data-k]').forEach(f => { const k = f.dataset.k; s[k] = ['stdMin', 'openingWip'].includes(k) ? num(f.value) : (k === 'dieId' ? (f.value || null) : f.value); }); });
}
function reRender() { $('#reBody').innerHTML = reHtml(); }
function reArr(path) { return path === 'm' ? RE.stages : RE.components[+path.slice(1)].stages; }
const rePrefix = path => path === 'm' ? RE.id + '_m' : RE.components[+path.slice(1)].id;

/* ================= events ================= */
document.addEventListener('click', async ev => {
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, D = S.ready.has('master') ? derive() : null;
  const needDb = () => { if (!S.db) { toast('اتصال به پایگاه داده برقرار نیست'); return false; } return true; };
  switch (act) {
    case 'menu': $('#side').classList.toggle('open'); break;
    case 'month': S.month = shiftMonth(S.month, -(+a.dataset.d)); bump(); break;
    case 'print': window.print(); break;
    case 'demoReset': confirmBox('بازگشت به داده‌های اولیه', 'همه ثبت‌ها و تغییراتی که در این مرورگر انجام شده پاک می‌شود و داده‌های اکسل دوباره بارگذاری می‌شود.', async () => { S.demoReset && S.demoReset(); }, 'بازگشت'); break;
    case 'closeModal': closeModal(); break;
    case 'setF': S.f[a.dataset.k] = a.dataset.v; bump(); break;
    case 'newReport': if (needDb()) openReport({ productId: a.dataset.p }); break;
    case 'editReport': { const e = entriesOf('ledger_prod').find(x => x.id === a.dataset.id); if (e) openReport({}, e); break; }
    case 'addRow': { const i = ROWN++; $('#rrows').insertAdjacentHTML('beforeend', reportRow(i, { productId: $$('#rrows [data-prodsel]').pop()?.value })); break; }
    case 'rmRow': { const rows = $$('#rrows .rrow'); if (rows.length > 1) a.closest('.rrow').remove(); break; }
    case 'delEntry': { const { k, m, id } = a.dataset; confirmBox('حذف ردیف', 'این ردیف برای همه کاربران حذف می‌شود و محاسبات به‌روز خواهد شد.', () => removeLedger(k, m, id)); break; }
    case 'editPlan': if (needDb()) openPlan(); break;
    case 'matMove': if (needDb()) openMatMove(a.dataset.id); break;
    case 'kardex': openKardex(a.dataset.id); break;
    case 'fgMove': if (needDb()) openFgMove(a.dataset.p, a.dataset.t || 'out', a.dataset.so); break;
    case 'editPO': if (needDb()) openPO(a.dataset.id); break;
    case 'delPO': { const id = a.dataset.id; confirmBox('حذف سفارش خرید', 'سفارش و رسیدهای آن حذف می‌شود و موجودی انبار اصلاح خواهد شد.', () => delDoc('po/' + id)); break; }
    case 'receive': if (needDb()) openReceive(a.dataset.id); break;
    case 'editSO': if (needDb()) openSO(a.dataset.id); break;
    case 'delSO': { const id = a.dataset.id; confirmBox('حذف سفارش مشتری', 'سفارش حذف می‌شود؛ تحویل‌های ثبت‌شده در انبار محصول باقی می‌مانند.', () => delDoc('so/' + id)); break; }
    case 'eqLog': if (needDb()) openEqLog(a.dataset.t, a.dataset.die, a.dataset.press); break;
    case 'editWorker': if (needDb()) openWorker(a.dataset.id); break;
    case 'editSupplier': if (needDb()) openSupplier(a.dataset.id); break;
    case 'editMaterial': if (needDb()) openMaterial(a.dataset.id); break;
    case 'editDie': if (needDb()) openDie(a.dataset.id); break;
    case 'editPress': if (needDb()) openPress(a.dataset.id); break;
    case 'editRules': if (needDb()) openRules(); break;
    case 'editProduct': if (needDb()) openProduct(a.dataset.id); break;
    case 'reAdd': { reSync(); const arr = reArr(a.dataset.path); arr.push({ id: rePrefix(a.dataset.path) + '_' + uid().slice(-5), name: '', stdMin: 0, machine: '', dieId: null, piecesPerStroke: 1, openingWip: 0 }); reRender(); break; }
    case 'reDel': { reSync(); const arr = reArr(a.dataset.path); const s = arr[+a.dataset.i]; if (D && D.stg[s.id]?.out) { toast('برای این مرحله گزارش ثبت شده؛ ابتدا گزارش‌ها را حذف کنید'); break; } arr.splice(+a.dataset.i, 1); reRender(); break; }
    case 'reMove': { reSync(); const arr = reArr(a.dataset.path), i = +a.dataset.i; if (i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; reRender(); } break; }
    case 'reAddComp': { reSync(); RE.components.push({ id: RE.id + '_c' + uid().slice(-5), name: 'زیرمونتاژ جدید', perUnit: 1, feedsInto: RE.stages[0]?.id || '', stages: [] }); reRender(); break; }
    case 'reDelComp': { reSync(); RE.components.splice(+a.dataset.i, 1); reRender(); break; }
    case 'csvReports': { const I = idx(); exportCSV('daily-reports-' + S.month, ['تاریخ', 'کارگر', 'محصول', 'مرحله', 'سالم', 'دوباره‌کاری', 'ضایعات', 'ساعت', 'توضیح'], monthEntries('ledger_prod', S.month).map(e => [e.date, I.wk[e.workerId]?.name, I.stage[e.stageId]?.product.name, I.stage[e.stageId]?.name, e.qty, e.rework, e.scrap, e.hours, e.note])); break; }
    case 'csvMat': { const I = idx(); exportCSV('materials-' + TODAY.replace(/\//g, '-'), ['ماده', 'واحد', 'محصول', 'موجودی', 'مصرف ماه', 'در راه', 'کافی برای (محصول)', 'روز پوشش'], S.master.materials.map(m => { const x = D.mat[m.id]; return [m.name, m.unit, I.prod[m.productId]?.name || '', x.stock.toFixed(2), x.consM.toFixed(2), x.onOrder, x.cover == null ? '' : Math.round(x.cover), x.days == null ? '' : Math.round(x.days)]; })); break; }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.f) { S.f[t.dataset.f] = t.value; bump(); return; }
  if (t.dataset.prodsel != null) { const i = t.dataset.prodsel; $('#f_s_' + i).innerHTML = stageOptions(t.value); return; }
  if (t.dataset.top === 'kind' && RE) { reSync(); if (RE.kind === 'assembly' && !RE.components.length) RE.components.push({ id: RE.id + '_c' + uid().slice(-5), name: 'زیرمونتاژ ۱', perUnit: 1, feedsInto: RE.stages[0]?.id || '', stages: [] }); reRender(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#side').classList.remove('open'); });

boot();
</script>

</body>
</html>
