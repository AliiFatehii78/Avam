<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --surface-2:#F5F7F5; --line:#D6DDD8; --line-2:#E6EBE7;
  --ink:#16201B; --ink-2:#44524B; --muted:#6C7A73;
  --accent:#0D6B59; --accent-ink:#FFFFFF; --accent-soft:#DAEEE8; --accent-2:#12483E;
  --ok:#2A8552; --ok-soft:#DDF1E4; --warn:#A86B0C; --warn-soft:#FBEFD6; --crit:#BD3526; --crit-soft:#FAE1DC;
  --info:#3A5F8A; --info-soft:#E1EAF5;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --r:10px; --r-sm:6px;
  --f-body:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-disp:"Noto Kufi Arabic","Vazirmatn",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#151C19; --surface-2:#1B2420; --line:#2B3731; --line-2:#222C27;
  --ink:#E3EAE6; --ink-2:#B2C0B8; --muted:#84938B;
  --accent:#3CB99E; --accent-ink:#06201A; --accent-soft:#163A31; --accent-2:#7FD6C1;
  --ok:#4BC283; --ok-soft:#17352541; --warn:#E3A63C; --warn-soft:#3A2D1461; --crit:#F06A5A; --crit-soft:#43201B80;
  --info:#7FA6D6; --info-soft:#1C2A3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#151C19; --surface-2:#1B2420; --line:#2B3731; --line-2:#222C27;
  --ink:#E3EAE6; --ink-2:#B2C0B8; --muted:#84938B;
  --accent:#3CB99E; --accent-ink:#06201A; --accent-soft:#163A31; --accent-2:#7FD6C1;
  --ok:#4BC283; --ok-soft:#17352541; --warn:#E3A63C; --warn-soft:#3A2D1461; --crit:#F06A5A; --crit-soft:#43201B80;
  --info:#7FA6D6; --info-soft:#1C2A3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;direction:rtl;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;line-height:1.35;text-wrap:balance}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--accent-2);color:#E6F2EE;padding-block:18px;padding-inline:14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
:root[data-theme="dark"] .side{background:#0A100E;border-inline-start:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side{background:#0A100E;border-inline-start:1px solid var(--line)}}
.brand{display:flex;gap:10px;align-items:center;padding-inline:6px}
.brand-mark{width:38px;height:38px;border-radius:8px;background:#E6F2EE;color:var(--accent-2);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:18px;flex:none}
:root[data-theme="dark"] .brand-mark{background:var(--accent);color:#06201A}
.brand b{font-family:var(--f-disp);font-size:16px;display:block;color:#fff}
.brand small{opacity:.7;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:11px;letter-spacing:.04em;opacity:.55;padding:10px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.nav a .cnt{margin-inline-start:auto;background:var(--crit);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.side-foot{margin-top:auto;font-size:11.5px;opacity:.7;padding-inline:8px;line-height:1.7}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-inline:24px;flex-wrap:wrap}
.topbar h1{font-size:19px}
.topbar .sp{flex:1}
.today{font-size:12.5px;color:var(--muted)}
.content{padding-block:20px 60px;padding-inline:24px;display:flex;flex-direction:column;gap:18px;max-width:1480px;width:100%}
.btn.menu-btn{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:600}
.field .hint{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.monthpick{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.monthpick button{border:0;background:transparent;padding:6px 9px;cursor:pointer;color:var(--ink-2)}
.monthpick span{min-width:112px;text-align:center;font-weight:700;font-size:13px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h3{font-size:14.5px}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-h .sp{flex:1}
.card-b{padding:14px 16px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.05fr) minmax(0,1.6fr)}
.page-intro{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-intro p{margin:0;color:var(--ink-2);max-width:70ch}
.page-intro .sp{flex:1}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .lbl{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .val{font-family:var(--f-disp);font-size:25px;font-weight:800;line-height:1.3}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);font-family:var(--f-body)}
.kpi .foot{font-size:11.5px;color:var(--muted)}
.kpi.ok .val{color:var(--ok)} .kpi.warn .val{color:var(--warn)} .kpi.crit .val{color:var(--crit)}
.meter{height:6px;border-radius:9px;background:var(--line-2);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px}
.meter.ok i{background:var(--ok)} .meter.warn i{background:var(--warn)} .meter.crit i{background:var(--crit)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.plain::before{display:none}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;white-space:nowrap}

/* alerts */
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line-2);align-items:center}
.alert:last-child{border-bottom:0}
.alert .bar{align-self:stretch;border-radius:3px;background:var(--muted)}
.alert.crit .bar{background:var(--crit)} .alert.warn .bar{background:var(--warn)} .alert.info .bar{background:var(--info)}
.alert b{font-size:13.5px;display:block}
.alert span{font-size:12.5px;color:var(--ink-2)}
.alert .area{font-size:11px;color:var(--muted)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:4px}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
tr.group td{background:var(--surface-2);font-weight:700;font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:12px}
.mini-bar{display:inline-block;width:70px;height:6px;border-radius:9px;background:var(--line-2);vertical-align:middle;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--accent)}
.mini-bar.ok i{background:var(--ok)} .mini-bar.warn i{background:var(--warn)} .mini-bar.crit i{background:var(--crit)}

/* production flow */
.flow-product{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:start}
.line-h{padding-top:6px}
.line-h b{font-size:13px;display:block}
.line-h small{color:var(--muted);font-size:11.5px;display:block}
.stages{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.stg{flex:0 0 150px;display:flex;align-items:stretch}
.stg-box{flex:1;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stg-box .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg-box .mc{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg-box .out{font-size:12px}
.stg-box .out b{font-family:var(--f-disp);font-size:15px}
.stg-box.hot{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.stg-box.bad{border-color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit)}
.arrow{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.arrow::before{content:"";position:absolute;top:50%;inset-inline:6px;border-top:1.5px dashed var(--line)}
.wip{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:99px;font-size:11.5px;font-weight:800;padding:0 7px;font-variant-numeric:tabular-nums}
.wip.z{color:var(--muted);font-weight:500}
.wip.hot{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.wip.bad{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.feed{font-size:11.5px;color:var(--accent);font-weight:600;padding-top:3px}
.fg-chip{flex:0 0 auto;align-self:center;margin-inline-start:6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.mini-flow{display:flex;flex-direction:column}
.mf-row{display:grid;grid-template-columns:110px minmax(0,1fr) 88px;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line-2)}
.mf-row:last-child{border-bottom:0}
.mf-row .pn{font-weight:700;font-size:13px}
.mf-row .pn small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.mf-track{display:flex;gap:3px;align-items:flex-end;min-width:0}
.mf-seg{flex:1;min-width:10px;display:flex;flex-direction:column;gap:3px;align-items:stretch}
.mf-seg i{display:block;height:8px;border-radius:3px;background:var(--line)}
.mf-seg.act i{background:var(--accent)}
.mf-seg.hot i{background:var(--warn)}
.mf-seg.bad i{background:var(--crit)}
.mf-seg em{font-style:normal;font-size:10px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.mf-fg{text-align:end;font-size:12px}
.mf-fg b{font-family:var(--f-disp);font-size:14px;display:block}

/* equipment */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.eq{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.eq h4{font-size:13.5px}
.odo{font-family:var(--f-disp);font-size:20px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.odo small{font-family:var(--f-body);font-size:11.5px;color:var(--muted);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.barrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .v{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-2);white-space:nowrap}
.track{height:10px;border-radius:5px;background:var(--line-2);position:relative;overflow:hidden}
.track i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:5px;background:var(--accent)}
.track.ok i{background:var(--ok)} .track.warn i{background:var(--warn)} .track.crit i{background:var(--crit)}
.track .mark{position:absolute;inset-block:-2px;width:2px;background:var(--ink-2);opacity:.55}

/* chart */
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.feed-list{display:flex;flex-direction:column}
.feed-item{display:flex;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line-2);font-size:12.5px;align-items:baseline}
.feed-item:last-child{border-bottom:0}
.feed-item time{color:var(--muted);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* modal */
dialog{border:0;border-radius:14px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);direction:rtl}
dialog::backdrop{background:rgba(10,20,16,.45)}
.m-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-h h3{font-size:16px;flex:1}
.m-b{padding:16px 18px;overflow:auto;max-height:calc(100vh - 190px);display:flex;flex-direction:column;gap:14px}
.m-f{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rows{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) repeat(4,minmax(0,.7fr)) 32px;gap:8px;align-items:end;padding:10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2)}
.rrow .x{align-self:center;margin-top:18px}
.note{font-size:12px;color:var(--ink-2);background:var(--info-soft);border-radius:8px;padding:8px 12px}
.err{font-size:12.5px;color:var(--crit);background:var(--crit-soft);border-radius:8px;padding:8px 12px}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:9px;font-weight:600;font-size:13px;z-index:50;box-shadow:var(--shadow)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-weight:600;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;font-weight:600;color:var(--ink-2)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.route-edit{display:flex;flex-direction:column;gap:10px}
.route-line{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.srow{display:grid;grid-template-columns:24px minmax(0,1.6fr) minmax(0,.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.6fr) auto;gap:6px;align-items:center}
.srow input,.srow select{padding:5px 7px;font-size:12.5px}
.skeleton{padding:60px 20px;text-align:center;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-inline-end:4px}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g-dash{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:250px;z-index:30;transform:translateX(100%);transition:transform .2s}
  .side.open{transform:none}
  .btn.menu-btn{display:inline-flex}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis>.kpi:last-child:nth-child(odd){grid-column:span 2}
  .content,.topbar{padding-inline:16px}
  .line{grid-template-columns:minmax(0,1fr)}
  .rrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .mf-row{grid-template-columns:80px minmax(0,1fr) 70px;padding-inline:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .side,.topbar .btn,.topbar .monthpick,.no-print{display:none!important}
  .shell{grid-template-columns:1fr}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
<div class="shell" id="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="topbar">
      <button class="btn ghost menu-btn" data-act="menu" aria-label="منو">☰</button>
      <h1 id="pageTitle">داشبورد مدیریتی</h1>
      <span class="today" id="todayLbl"></span>
      <span class="sp"></span>
      <div class="monthpick" id="monthPick">
        <button data-act="month" data-d="1" aria-label="ماه قبل">›</button>
        <span id="monthLbl"></span>

<script>
/* ================= utilities ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const FA = '۰۱۲۳۴۵۶۷۸۹';
const toFa = s => String(s ?? '').replace(/\d/g, d => FA[d]);
const toEn = s => String(s ?? '').replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g, '.').replace(/[,،]/g, '');
const num = v => { const x = parseFloat(toEn(v)); return isFinite(x) ? x : 0; };
const fn = (n, d = 0) => (n == null || !isFinite(n)) ? '—' : Number(n).toLocaleString('fa-IR', { maximumFractionDigits: d });
const pct = (n, d = 0) => (n == null || !isFinite(n)) ? '—' : fn(n, d) + '٪';
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = (a, f = x => x) => a.reduce((s, x) => s + (f(x) || 0), 0);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

function normDate(s) {
  s = toEn(s).trim().replace(/[-.]/g, '/');
  const p = s.split('/').filter(Boolean).map(Number);
  if (p.length !== 3 || p.some(isNaN)) return null;
  let [y, m, d] = p;
  if (y < 100) y += 1400; else if (y < 1000) y += 1000;
  if (m < 1 || m > 12 || d < 1 || d > (m <= 6 ? 31 : 30)) return null;
  return `${y}/${pad(m)}/${pad(d)}`;
}
function jdn(s) { const [y, m, d] = s.split('/').map(Number); const jy = y + 1595; return -355668 + 365 * jy + Math.floor(jy / 33) * 8 + Math.floor(((jy % 33) + 3) / 4) + d + (m < 7 ? (m - 1) * 31 : (m - 7) * 30 + 186); }
const daysBetween = (a, b) => jdn(b) - jdn(a);
function todayJ() {
  try {
    const p = new Intl.DateTimeFormat('en-US-u-ca-persian', { year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const g = t => toEn(p.find(x => x.type === t).value).replace(/\D/g, '');
    return `${g('year')}/${pad(g('month'))}/${pad(g('day'))}`;
  } catch (e) { return '1405/06/20'; }
}
const TODAY = todayJ();
const IS_FRIDAY = new Date().getDay() === 5;
const monthOf = d => d.slice(0, 7).replace('/', '-');
const monthLabel = k => { const [y, m] = k.split('-'); return MONTHS[+m - 1] + ' ' + toFa(y); };
function shiftMonth(k, dl) { let [y, m] = k.split('-').map(Number); m += dl; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; }
const daysInMonth = k => { const m = +k.split('-')[1]; return m <= 6 ? 31 : m <= 11 ? 30 : 30; };
const fd = d => d ? toFa(d) : '—';
const inMonth = (d, k) => d && monthOf(d) === k;

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ================= state ================= */
const S = {
  db: null, dbState: 'loading', downloads: null,
  master: { workers: [], products: [], materials: [], suppliers: [], equipment: { presses: [], dies: [] }, settings: {} },
  led: { ledger_prod: {}, ledger_mat: {}, ledger_fg: {}, ledger_eq: {} },
  po: {}, so: {}, plans: {}, meta: {},
  ready: new Set(),
  month: monthOf(TODAY),
  route: 'dashboard',
  f: { worker: '', product: '', poStatus: 'open', soStatus: 'open', eqType: '', setTab: 'products', matView: 'all' },
  ver: 0,
};
const DEF_SET = { pmWarnPct: 85, lifeWarnPct: 90, prodWarnPct: 70, scrapWarnPpm: 10000, supplierWarn: 80, soWarnDays: 7, poLateCritDays: 7, planLagPct: 15, autoConsume: true };
const SET = () => ({ ...DEF_SET, ...(S.master.settings || {}) });

/* ================= db ================= */
const TAB = uid();
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function mutate(path, fnc) {
  if (!S.db) throw { message: 'اتصال به پایگاه داده برقرار نیست؛ تغییرات ذخیره نمی‌شود.' };
  const ref = S.db.doc(path);
  for (let i = 0; i < 10; i++) {
    let got = true;
    try { const r = await ref.acquire({ holder: TAB, ttlMs: 6000 }); got = r.acquired; } catch (e) { got = true; }
    if (got) {
      try {
        const s = await ref.get();
        const cur = s.exists ? JSON.parse(JSON.stringify(s.data())) : {};
        await ref.set(fnc(cur));
        return;
      } catch (e) { if (!e || e.code !== 'conflict') throw e; }
    }
    await sleep(250 + Math.random() * 500);
  }
  throw { message: 'کاربر دیگری همزمان در حال ثبت است؛ چند ثانیه بعد دوباره تلاش کنید.' };
}
async function setDoc(path, data) { if (!S.db) throw { message: 'اتصال به پایگاه داده برقرار نیست.' }; await S.db.doc(path).set(data); }
async function delDoc(path) { if (!S.db) throw { message: 'اتصال به پایگاه داده برقرار نیست.' }; await S.db.doc(path).delete(); }
const appendLedger = (kind, date, entries) => mutate(`${kind}/${monthOf(date)}`, d => ({ ...d, entries: [...(d.entries || []), ...entries] }));
const removeLedger = (kind, month, id) => mutate(`${kind}/${month}`, d => ({ ...d, entries: (d.entries || []).filter(e => e.id !== id) }));
async function replaceLedger(kind, oldMonth, entry) {
  if (monthOf(entry.date) === oldMonth) return mutate(`${kind}/${oldMonth}`, d => ({ ...d, entries: (d.entries || []).map(e => e.id === entry.id ? entry : e) }));
  await removeLedger(kind, oldMonth, entry.id); await appendLedger(kind, entry.date, [entry]);
}
const saveMasterItems = (name, items) => mutate(`master/${name}`, d => ({ ...d, items }));
function upsertMaster(name, item) {
  return mutate(`master/${name}`, d => { const items = [...(d.items || [])]; const i = items.findIndex(x => x.id === item.id); if (i >= 0) items[i] = item; else items.push(item); return { ...d, items }; });
}

let renderQueued = false;
function bump() { S.ver++; if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

async function boot() {
  renderChrome(); render();
  let db = null;
  if (window.claude) {
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    try { S.downloads = await window.claude.use('downloads'); } catch (e) { S.downloads = null; }
  } else if (/^https?:$/.test(location.protocol) && !/github\.io$/.test(location.hostname)) {
    db = await connectLocalDb();
    if (db) { S.local = true; S.downloads = LOCAL_DOWNLOADS; }
  }
  if (!db && window.AVAM_SEED_ENC) {
    db = await connectDemoDb();
    if (db) { S.demo = true; S.downloads = LOCAL_DOWNLOADS; }
  }
  if (!db) { S.dbState = 'none'; bump(); return; }
  S.db = db; S.dbState = 'ok';
  const onErr = e => { console.warn(e); if (e && e.code === 'revoked') { S.dbState = 'revoked'; bump(); } };
  const sub = (coll, apply) => db.collection(coll).onSnapshot(snap => { apply(snap.docs); S.ready.add(coll); bump(); }, onErr);
  sub('master', docs => { docs.forEach(d => { const x = JSON.parse(JSON.stringify(d.data() || {})); if (d.id === 'equipment') S.master.equipment = { presses: x.presses || [], dies: x.dies || [] }; else if (d.id === 'settings') S.master.settings = x; else S.master[d.id] = x.items || []; }); });
  for (const k of Object.keys(S.led)) sub(k, docs => { const o = {}; docs.forEach(d => o[d.id] = d.data()); S.led[k] = o; });
  sub('po', docs => { const o = {}; docs.forEach(d => o[d.id] = { id: d.id, ...d.data() }); S.po = o; });
  sub('so', docs => { const o = {}; docs.forEach(d => o[d.id] = { id: d.id, ...d.data() }); S.so = o; });
  sub('plans', docs => { const o = {}; docs.forEach(d => o[d.id] = d.data()); S.plans = o; });
  sub('meta', docs => { docs.forEach(d => S.meta[d.id] = d.data()); });
}

/* ================= indexes & derived data ================= */
let IDXv = -1, IDX = null, Dv = -1, D = null;
function idx() {
  if (IDXv === S.ver && IDX) return IDX;
  const M = S.master, I = { prod: {}, stage: {}, mat: {}, sup: {}, wk: {}, die: {}, press: {} };
  M.products.forEach(p => {
    I.prod[p.id] = p;
    const lines = [...(p.components || []).map(c => ({ ...c, kind: 'comp' })), { id: p.id + '_main', name: p.kind === 'assembly' ? 'خط مونتاژ نهایی' : 'مسیر تولید', perUnit: 1, stages: p.stages || [], kind: 'main' }];
    p._lines = lines;
    lines.forEach(L => (L.stages || []).forEach((s, i) => {
      I.stage[s.id] = { ...s, product: p, line: L, idx: i, perUnit: L.perUnit || 1, next: L.stages[i + 1] || null, last: i === L.stages.length - 1 };
    }));
  });
  M.materials.forEach(m => I.mat[m.id] = m);
  M.suppliers.forEach(s => I.sup[s.id] = s);
  M.workers.forEach(w => I.wk[w.id] = w);
  (M.equipment.dies || []).forEach(d => I.die[d.id] = d);
  (M.equipment.presses || []).forEach(p => I.press[p.id] = p);
  IDXv = S.ver; IDX = I; return I;
}
const entriesOf = kind => Object.values(S.led[kind] || {}).flatMap(d => (d && d.entries) || []);
const monthEntries = (kind, k) => ((S.led[kind] || {})[k]?.entries) || [];
const stageLabel = sid => { const s = idx().stage[sid]; return s ? `${s.product.name} › ${s.line.kind === 'comp' ? s.line.name + ' › ' : ''}${s.name}` : '—'; };

function poEval(po) {
  const rec = po.receipts || [];
  const got = sum(rec, r => r.qty);
  if (!rec.length) return { got, score: null };
  const last = rec.reduce((a, r) => (!a || r.date > a.date) ? r : a, null);
  let late = 0;
  if (rec.some(r => r.lateDays != null)) late = Math.max(...rec.map(r => r.lateDays || 0));
  else if (po.dueDate && last.date) late = Math.max(0, daysBetween(po.dueDate, last.date) - (po.allowedDelay || 0));
  const unallowed = Math.max(0, Math.abs((po.qty || 0) - got) - (po.allowedChange || 0));
  const volume = po.qty ? clamp((po.qty - unallowed) / po.qty * 100, 0, 100) : 100;
  const delivery = clamp(100 - 10 * late, 0, 100);
  const W = [1, 2, 4, 8];
  const weighted = sum(rec, r => sum((r.nc || []).map((n, i) => (n || 0) * W[i])));
  const ppm = got ? weighted / got * 1e6 : 0;
  const quality = clamp(100 - 0.01 * ppm, 0, 100);
  const transport = Math.min(...rec.map(r => r.transport ?? 100));
  const disrupt = rec.some(r => r.disruption) ? 0 : 100;
  const score = transport * 0.2 + quality * 0.3 + delivery * 0.2 + volume * 0.1 + disrupt * 0.2;
  return { got, late, volume, delivery, quality, transport, disrupt, ppm, score, lastDate: last.date };
}

function derive() {
  if (Dv === S.ver && D) return D;
  const I = idx(), M = S.master, st = SET(), K = S.month;
  const prod = entriesOf('ledger_prod');
  const stg = {}; // per stage stats
  const g = id => stg[id] || (stg[id] = { out: 0, scr: 0, rw: 0, mOut: 0, mScr: 0, mRw: 0, mHrs: 0 });
  prod.forEach(e => { const s = g(e.stageId); s.out += e.qty || 0; s.scr += e.scrap || 0; s.rw += e.rework || 0; if (inMonth(e.date, K)) { s.mOut += e.qty || 0; s.mScr += e.scrap || 0; s.mRw += e.rework || 0; s.mHrs += e.hours || 0; } });
  const consumed = id => { const s = stg[id]; return s ? s.out + s.scr : 0; };
  // WIP after each stage
  const wip = {};
  M.products.forEach(p => (p._lines || []).forEach(L => (L.stages || []).forEach((s, i) => {
    const outS = (stg[s.id]?.out || 0) + (s.openingWip || 0);
    let used = 0;
    if (i < L.stages.length - 1) used = consumed(L.stages[i + 1].id);
    else if (L.kind === 'comp' && L.feedsInto && I.stage[L.feedsInto]) { const fs = I.stage[L.feedsInto]; used = consumed(fs.id) * (L.perUnit || 1) / (fs.perUnit || 1); }
    else if (L.kind === 'main') used = null;
    wip[s.id] = used == null ? null : outS - used;
  })));
  // finished goods
  const fgLed = entriesOf('ledger_fg');
  const fg = {};
  M.products.forEach(p => {
    const lastMain = (p.stages || [])[p.stages.length - 1];
    const made = lastMain ? (stg[lastMain.id]?.out || 0) : 0;
    const madeM = lastMain ? (stg[lastMain.id]?.mOut || 0) : 0;
    const L = fgLed.filter(e => e.productId === p.id);
    const inQ = sum(L.filter(e => e.type === 'in'), e => e.qty), outQ = sum(L.filter(e => e.type === 'out'), e => e.qty), adj = sum(L.filter(e => e.type === 'adj'), e => e.qty);
    const mIn = sum(L.filter(e => e.type === 'in' && inMonth(e.date, K)), e => e.qty) + madeM;
    const mOut = sum(L.filter(e => e.type === 'out' && inMonth(e.date, K)), e => e.qty);
    fg[p.id] = { stock: (p.fgOpening || 0) + made + inQ - outQ + adj, made, madeM, mIn, mOut, lastMain };
  });
  // materials
  const matLed = entriesOf('ledger_mat');
  const pos = Object.values(S.po);
  const mat = {};
  M.materials.forEach(m => {
    let s = m.opening || 0, cons = 0, consM = 0, rec = 0, recM = 0, adj = 0;
    pos.forEach(po => { if (po.imported || po.materialId !== m.id) return; (po.receipts || []).forEach(r => { s += r.qty || 0; rec += r.qty || 0; if (inMonth(r.date, K)) recM += r.qty || 0; }); });
    matLed.filter(e => e.materialId === m.id).forEach(e => { const q = e.type === 'out' ? -(e.qty || 0) : (e.qty || 0); s += q; adj += q; });
    if (st.autoConsume && m.stageId && I.stage[m.stageId] && m.perProduct) {
      const S0 = I.stage[m.stageId];
      prod.forEach(e => { if (e.stageId !== m.stageId || (m.openingDate && e.date <= m.openingDate)) return; const q = ((e.qty || 0) + (e.scrap || 0)) * m.perProduct / (S0.perUnit || 1); cons += q; if (inMonth(e.date, K)) consM += q; });
      s -= cons;
    }
    const onOrder = sum(pos.filter(po => !po.imported && po.materialId === m.id && po.status === 'open'), po => Math.max(0, (po.qty || 0) - sum(po.receipts || [], r => r.qty)));
    const cover = m.perProduct ? s / m.perProduct : null;
    const p = I.prod[m.productId];
    const daily = p && p.monthlyForecast ? p.monthlyForecast / 26 : 0;
    const days = cover != null && daily ? cover / daily : null;
    let status = 'ok';
    if (s < 0) status = 'crit';
    else if (m.perProduct && m.reorderProducts) { if (cover < m.reorderProducts * 0.5) status = 'crit'; else if (cover < m.reorderProducts) status = 'warn'; }
    mat[m.id] = { stock: s, cons, consM, rec, recM, adj, onOrder, cover, days, status, value: s * (m.price || 0) };
  });
  // equipment
  const eqLed = entriesOf('ledger_eq');
  const dieEv = {}, pressEv = {};
  const push = (o, k, ev) => { if (!k) return; (o[k] || (o[k] = [])).push(ev); };
  eqLed.forEach(e => { if (e.type === 'run') { push(dieEv, e.dieId, { d: e.date, t: 'run', n: e.strokes || 0 }); push(pressEv, e.pressId || I.die[e.dieId]?.pressId, { d: e.date, t: 'run', n: e.strokes || 0, h: e.hours || 0 }); } else if (e.type === 'pm') { if (e.dieId) push(dieEv, e.dieId, { d: e.date, t: 'pm' }); else push(pressEv, e.pressId, { d: e.date, t: 'pm' }); } });
  prod.forEach(e => { const s = I.stage[e.stageId]; if (!s || !s.dieId) return; const n = ((e.qty || 0) + (e.scrap || 0)) / (s.piecesPerStroke || 1); push(dieEv, s.dieId, { d: e.date, t: 'run', n }); const pr = I.die[s.dieId]?.pressId; push(pressEv, pr, { d: e.date, t: 'run', n, h: e.hours || 0 }); });
  const order = { run: 0, pm: 1 };
  const die = {};
  (M.equipment.dies || []).forEach(d => {
    const ev = (dieEv[d.id] || []).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : order[a.t] - order[b.t]);
    let total = d.baseStrokes || 0, since = 0, hasPm = d.lastPmStrokes != null, lastPm = null, mRun = 0;
    ev.forEach(x => { if (x.t === 'run') { total += x.n; since += x.n; if (inMonth(x.d, K)) mRun += x.n; } else { since = 0; hasPm = true; lastPm = x.d; } });
    const pmPct = d.pmEvery ? since / d.pmEvery * 100 : null;
    const lifePct = d.life ? total / d.life * 100 : null;
    let status = 'ok';
    if (!hasPm) status = 'unknown';
    else if (pmPct >= 100) status = 'crit';
    else if (pmPct >= st.pmWarnPct) status = 'warn';
    die[d.id] = { total, since, pmPct, lifePct, lastPm, hasPm, status, mRun, toPm: d.pmEvery ? d.pmEvery - since : null };
  });
  const press = {};
  (M.equipment.presses || []).forEach(p => {
    const ev = pressEv[p.id] || [];
    const strokes = (p.baseStrokes || 0) + sum(ev.filter(x => x.t === 'run'), x => x.n);
    const hours = (p.baseHours || 0) + sum(ev.filter(x => x.t === 'run'), x => x.h);
    const pmDates = ev.filter(x => x.t === 'pm').map(x => x.d).concat(p.lastPmDate ? [p.lastPmDate] : []).sort();
    const lastPm = pmDates[pmDates.length - 1] || null;
    const since = lastPm ? daysBetween(lastPm, TODAY) : null;
    let status = 'unknown';
    if (lastPm && p.pmEveryDays) status = since >= p.pmEveryDays ? 'crit' : since >= p.pmEveryDays * st.pmWarnPct / 100 ? 'warn' : 'ok';
    const mRun = sum(ev.filter(x => x.t === 'run' && inMonth(x.d, K)), x => x.n);
    press[p.id] = { strokes, hours, lastPm, since, status, mRun };
  });
  const eqCostM = sum(eqLed.filter(e => inMonth(e.date, K)), e => e.cost || 0);
  const downM = sum(eqLed.filter(e => e.type === 'repair' && inMonth(e.date, K)), e => e.hours || 0);
  // suppliers
  const poEv = {}; pos.forEach(po => poEv[po.id] = poEval(po));
  const sup = {};
  M.suppliers.forEach(s => {
    const mine = pos.filter(po => po.supplierId === s.id);
    const scored = mine.map(po => poEv[po.id]).filter(x => x.score != null);
    sup[s.id] = { n: mine.length, open: mine.filter(po => po.status === 'open').length, score: scored.length ? sum(scored, x => x.score) / scored.length : null, last: scored.map(x => x.lastDate).sort().pop() || null };
  });
  // customer orders
  const soDel = {};
  fgLed.forEach(e => { if (e.type === 'out' && e.soId) soDel[e.soId] = (soDel[e.soId] || 0) + (e.qty || 0); });
  // workers (month)
  const wk = {};
  prod.filter(e => inMonth(e.date, K)).forEach(e => {
    const w = wk[e.workerId] || (wk[e.workerId] = { qty: 0, scr: 0, rw: 0, hrs: 0, std: 0, days: new Set(), rows: 0 });
    const s = I.stage[e.stageId];
    w.qty += e.qty || 0; w.scr += e.scrap || 0; w.rw += e.rework || 0; w.hrs += e.hours || 0; w.rows++;
    w.std += (e.qty || 0) * (s?.stdMin || 0) / 60; w.days.add(e.date);
  });
  Object.values(wk).forEach(w => { w.eff = w.hrs ? w.std / w.hrs * 100 : null; });
  // month totals
  const mProd = prod.filter(e => inMonth(e.date, K));
  const mStd = sum(mProd, e => (e.qty || 0) * (I.stage[e.stageId]?.stdMin || 0) / 60);
  const mHrs = sum(mProd, e => e.hours || 0);
  const mGood = sum(mProd, e => e.qty), mScr = sum(mProd, e => e.scrap), mRw = sum(mProd, e => e.rework);
  const daily = {}; mProd.forEach(e => { daily[e.date] = (daily[e.date] || 0) + (e.qty || 0) * (I.stage[e.stageId]?.stdMin || 0) / 60; });
  const todayRows = prod.filter(e => e.date === TODAY);
  const lastReport = prod.reduce((a, e) => !a || e.date > a ? e.date : a, null);
  // plan
  const plan = S.plans[K] || null;
  let planAch = null, planStd = 0, planDone = 0;
  const planRows = [];
  if (plan && plan.items && plan.items.length) {

  if (S.demo) html += `<div class="note no-print" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span><b>نسخه نمایشی:</b> داده‌ها از فایل‌های اکسل کارخانه (تا ۱۴۰۵/۰۵/۱۴) بارگذاری شده‌اند. هر ثبت یا تغییری فقط در همین مرورگر ذخیره می‌شود و دیگران آن را نمی‌بینند.</span><span style="flex:1"></span><button class="btn sm" data-act="demoReset">بازگشت به داده‌های اولیه</button></div>`;
  if (S.dbState === 'revoked') html += `<div class="banner">دسترسی به داده‌ها قطع شد؛ صفحه را دوباره باز کنید.</div>`;
  if (!D) { $('#view').innerHTML = html || '<div class="skeleton">در حال بارگذاری…</div>'; return; }
  try { html += VIEWS[S.route](D); } catch (e) { console.error(e); html += `<div class="err">خطا در نمایش این بخش: ${esc(e.message)}</div>`; }
  $('#view').innerHTML = html;
  if (lastFocus) { const el = document.getElementById(lastFocus.id); if (el) { el.focus(); try { el.setSelectionRange(lastFocus.s, lastFocus.e); } catch (e) { } } }
}
window.addEventListener('hashchange', () => { $('#side').classList.remove('open'); bump(); window.scrollTo(0, 0); });

/* ================= small render helpers ================= */
const sevTxt = { ok: 'عادی', warn: 'هشدار', crit: 'بحرانی', unknown: 'نامشخص', info: 'اطلاع' };
const pill = (sev, txt) => `<span class="pill ${sev === 'unknown' ? 'info' : sev}">${esc(txt ?? sevTxt[sev])}</span>`;
const selOpts = (items, val, empty) => (empty != null ? `<option value="">${esc(empty)}</option>` : '') + items.map(x => `<option value="${esc(x.id)}" ${x.id === val ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
const card = (title, sub, body, tools = '', cls = '') => `<section class="card ${cls}"><div class="card-h"><h3>${title}</h3>${sub ? `<span class="sub">${sub}</span>` : ''}<span class="sp"></span>${tools}</div>${body}</section>`;
const effSev = v => v == null ? 'unknown' : v >= 90 ? 'ok' : v >= SET().prodWarnPct ? 'warn' : 'crit';
const meter = (v, sev) => `<div class="meter ${sev || ''}"><i style="width:${clamp(v || 0, 0, 100)}%"></i></div>`;
const activeProducts = () => S.master.products.filter(p => p.active !== false);

function stageOptions(pid, val) {
  const p = idx().prod[pid]; if (!p) return '<option value="">ابتدا محصول را انتخاب کنید</option>';
  return '<option value="">انتخاب مرحله…</option>' + (p._lines || []).filter(L => L.stages?.length).map(L => `<optgroup label="${esc(L.name)}${L.kind === 'comp' ? ' (×' + toFa(L.perUnit) + ')' : ''}">${L.stages.map(s => `<option value="${s.id}" ${s.id === val ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</optgroup>`).join('');
}

/* ================= views ================= */
const VIEWS = {};

VIEWS.dashboard = D => {
  const I = idx(), st = SET();
  const crit = D.alerts.filter(a => a.sev === 'crit').length, warn = D.alerts.filter(a => a.sev === 'warn').length;
  const wkActive = S.master.workers.filter(w => w.active !== false).length;
  const todayWorkers = new Set(D.todayRows.map(e => e.workerId)).size;
  const eff = D.mHrs ? D.mStd / D.mHrs * 100 : null;
  const ppm = (D.mGood + D.mScr) ? D.mScr / (D.mGood + D.mScr) * 1e6 : null;
  const openSO = Object.values(S.so).filter(s => s.status === 'open');
  const lateSO = openSO.filter(s => (s.qty - (D.soDel[s.id] || 0)) > 0 && s.dueDate && s.dueDate < TODAY).length;
  const kpis = `<div class="kpis">
    <div class="kpi ${D.planAch == null ? '' : D.planAch >= 90 ? 'ok' : D.planAch >= 70 ? 'warn' : 'crit'}"><span class="lbl">تحقق برنامه ${esc(monthLabel(S.month))}</span><span class="val">${D.planAch == null ? '—' : pct(D.planAch)}</span>${D.planAch == null ? `<span class="foot">${D.plan ? 'برنامه بدون محصول' : 'برنامه این ماه ثبت نشده'}</span>` : meter(D.planAch, D.planAch >= 90 ? 'ok' : D.planAch >= 70 ? 'warn' : 'crit') + `<span class="foot">بر اساس ساعت استاندارد محصولات</span>`}</div>
    <div class="kpi"><span class="lbl">گزارش‌های امروز</span><span class="val">${fn(todayWorkers)}<small> از ${fn(wkActive)} نفر</small></span><span class="foot">${fn(D.todayRows.length)} ردیف · ${fn(sum(D.todayRows, e => e.qty))} قطعه سالم</span></div>
    <div class="kpi ${eff == null ? '' : effSev(eff)}"><span class="lbl">بهره‌وری پرسنل (ماه)</span><span class="val">${eff == null ? '—' : pct(eff)}</span><span class="foot">${fn(D.mStd, 0)} ساعت استاندارد / ${fn(D.mHrs, 0)} ساعت حضور</span></div>
    <div class="kpi ${ppm == null ? '' : ppm > st.scrapWarnPpm ? 'crit' : ppm > st.scrapWarnPpm / 2 ? 'warn' : 'ok'}"><span class="lbl">ضایعات ماه</span><span class="val">${ppm == null ? '—' : fn(ppm)}<small> ppm</small></span><span class="foot">${fn(D.mScr)} ضایعات · ${fn(D.mRw)} دوباره‌کاری</span></div>
    <div class="kpi ${lateSO ? 'crit' : ''}"><span class="lbl">سفارش‌های باز مشتری</span><span class="val">${fn(openSO.length)}</span><span class="foot">${lateSO ? fn(lateSO) + ' سفارش معوق' : 'بدون سفارش معوق'}</span></div>
  </div>`;

  const alerts = card('هشدارهای کنترلی', `${fn(crit)} بحرانی · ${fn(warn)} هشدار`,
    `<div class="alerts">${D.alerts.length ? D.alerts.slice(0, 14).map(a => `<div class="alert ${a.sev}"><i class="bar"></i><div><span class="area">${esc(a.area)}</span><b>${esc(a.title)}</b><span>${esc(a.detail)}</span></div><a class="btn sm ghost" href="#${a.link}">بررسی</a></div>`).join('') + (D.alerts.length > 14 ? `<div class="empty">و ${fn(D.alerts.length - 14)} مورد دیگر — در بخش مربوط ببینید.</div>` : '') : '<div class="empty"><b>همه چیز در محدوده مجاز است</b>هیچ قاعده کنترلی نقض نشده.</div>'}</div>`);

  // mini flow
  const rows = activeProducts().filter(p => (p._lines || []).some(L => L.stages?.length)).map(p => {
    const main = p.stages || [];
    const segs = (p.kind === 'assembly' ? p._lines.flatMap(L => L.stages) : main).map(s => {
      const w = D.wip[s.id]; const m = D.stg[s.id]?.mOut || 0;
      const cls = w != null && w < 0 ? 'bad' : (w || 0) > 0 && (w || 0) >= Math.max(...Object.values(D.wip).filter(x => x > 0), 1) * 0.6 ? 'hot' : m ? 'act' : '';
      return `<div class="mf-seg ${cls}" title="${esc(s.name)} — تولید ماه ${fn(m)} · در انتظار بعد: ${w == null ? '—' : fn(w)}"><i></i><em>${w ? fn(w) : ''}</em></div>`;
    }).join('');
    return `<div class="mf-row"><div class="pn">${esc(p.name)}<small>${p.kind === 'assembly' ? 'مونتاژی' : 'خطی'} · ${fn(p._lines.reduce((a, L) => a + (L.stages?.length || 0), 0))} مرحله</small></div><div class="mf-track">${segs}</div><div class="mf-fg"><b>${fn(D.fg[p.id]?.stock)}</b>موجودی محصول</div></div>`;
  }).join('');
  const flow = card('قطعات در مراحل تولید', 'عدد زیر هر مرحله: قطعه در انتظار مرحله بعد', `<div class="mini-flow">${rows}</div><div class="card-b legend"><span><i style="background:var(--accent)"></i>فعال این ماه</span><span><i style="background:var(--warn)"></i>انباشت زیاد (گلوگاه)</span><span><i style="background:var(--crit)"></i>گزارش ناسازگار</span></div>`, `<a class="btn sm" href="#flow">نمای کامل</a>`);

  // materials coverage
  const mats = S.master.materials.filter(m => m.active !== false && m.perProduct && !m.isScrap).map(m => ({ m, x: D.mat[m.id] })).sort((a, b) => (a.x.cover / (a.m.reorderProducts || 1)) - (b.x.cover / (b.m.reorderProducts || 1)));
  const matBars = mats.slice(0, 9).map(({ m, x }) => {
    const max = Math.max(m.maxProducts || 0, m.reorderProducts * 2, x.cover || 0, 1);
    return `<div class="barrow"><span class="nm" title="${esc(m.name)}">${esc(m.name)}</span><div class="track ${x.status}"><i style="width:${clamp((x.cover || 0) / max * 100, 0, 100)}%"></i><span class="mark" style="inset-inline-start:${clamp(m.reorderProducts / max * 100, 0, 100)}%"></span></div><span class="v">${fn(x.cover)} ${esc(I.prod[m.productId]?.name || '')}</span></div>`;
  }).join('');
  const matCard = card('پوشش مواد اولیه', 'تعداد محصول قابل ساخت · خط: نقطه سفارش', `<div class="card-b bars">${matBars || '<div class="empty">ماده‌ای تعریف نشده</div>'}</div>`, `<a class="btn sm" href="#materials">انبار</a>`);

  // equipment
  const dies = (S.master.equipment.dies || []).map(d => ({ d, x: D.die[d.id] }));
  const eqBars = dies.map(({ d, x }) => `<div class="barrow"><span class="nm" title="${esc(d.name)}">${esc(d.name)}</span><div class="track ${x.status === 'unknown' ? '' : x.status}"><i style="width:${x.status === 'unknown' ? 0 : clamp(x.pmPct, 0, 100)}%"></i></div><span class="v">${x.status === 'unknown' ? 'PM ثبت نشده' : fn(x.since) + ' / ' + fn(d.pmEvery)}</span></div>`).join('')
    + (S.master.equipment.presses || []).filter(p => D.press[p.id].status !== 'unknown').map(p => { const x = D.press[p.id]; return `<div class="barrow"><span class="nm">${esc(p.name)}</span><div class="track ${x.status}"><i style="width:${clamp(x.since / p.pmEveryDays * 100, 0, 100)}%"></i></div><span class="v">${fn(x.since)} / ${fn(p.pmEveryDays)} روز</span></div>`; }).join('');
  const eqCard = card('نگهداری پرس و قالب', 'ضرب از آخرین PM نسبت به تناوب', `<div class="card-b bars">${eqBars || '<div class="empty">قالبی تعریف نشده</div>'}</div>`, `<a class="btn sm" href="#equipment">جزئیات</a>`);

  // daily chart
  const dim = daysInMonth(S.month); const vals = Array.from({ length: dim }, (_, i) => D.daily[`${S.month.replace('-', '/')}/${pad(i + 1)}`] || 0);
  const mx = Math.max(...vals, 1); const W = 620, H = 150, pl = 34, pb = 20, bw = (W - pl - 6) / dim;
  const ticks = [0, mx / 2, mx];
  const chart = `<div class="chart card-b"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ساعت استاندارد تولید روزانه">
    ${ticks.map(t => { const y = H - pb - (t / mx) * (H - pb - 10); return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line-2)"/><text x="${pl - 6}" y="${y + 3}" text-anchor="end">${fn(t)}</text>`; }).join('')}
    ${vals.map((v, i) => { const h = (v / mx) * (H - pb - 10); const x = W - 6 - (i + 1) * bw + 2; return `<rect x="${x}" y="${H - pb - h}" width="${Math.max(bw - 3, 2)}" height="${Math.max(h, v ? 1 : 0)}" rx="2" fill="${`${S.month.replace('-', '/')}/${pad(i + 1)}` === TODAY ? 'var(--warn)' : 'var(--accent)'}"/>${(i + 1) % 5 === 0 || i === 0 ? `<text x="${x + bw / 2 - 1}" y="${H - 5}" text-anchor="middle">${toFa(i + 1)}</text>` : ''}`; }).join('')}
  </svg></div>`;
  const chartCard = card('کارکرد روزانه', 'ساعت استاندارد تولید شده در هر روز ' + esc(monthLabel(S.month)), D.mStd ? chart : `<div class="empty"><b>برای ${esc(monthLabel(S.month))} گزارشی ثبت نشده</b>با «+ گزارش روزانه» اولین گزارش را ثبت کنید.</div>`);

  // orders + suppliers
  const soList = Object.values(S.so).filter(s => s.status === 'open').sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || '')).slice(0, 6);
  const soCard = card('سفارش‌های باز', '', soList.length ? `<div class="tbl-wrap"><table><thead><tr><th>محصول</th><th>مشتری</th><th>موعد</th><th class="n">پیشرفت</th></tr></thead><tbody>${soList.map(s => { const d = D.soDel[s.id] || 0; const p = s.qty ? d / s.qty * 100 : 0; const late = s.dueDate < TODAY && d < s.qty; return `<tr><td>${esc(I.prod[s.productId]?.name)}</td><td>${esc(s.customer)}</td><td>${fd(s.dueDate)} ${late ? pill('crit', 'معوق') : ''}</td><td class="n">${fn(d)} / ${fn(s.qty)} <span class="mini-bar ${late ? 'crit' : 'ok'}"><i style="width:${clamp(p, 0, 100)}%"></i></span></td></tr>`; }).join('')}</tbody></table></div>` : `<div class="empty"><b>سفارش بازی ثبت نشده</b>سفارش‌های ماهانه مشتری را در «سفارش و تحویل مشتری» وارد کنید.</div>`, `<a class="btn sm" href="#orders">همه</a>`);
  const sups = S.master.suppliers.map(s => ({ s, x: D.sup[s.id] })).filter(o => o.x.score != null).sort((a, b) => b.x.score - a.x.score);
  const supCard = card('رتبه تامین‌کنندگان', 'میانگین امتیاز محموله‌ها', `<div class="card-b bars">${sups.map(({ s, x }) => `<div class="barrow"><span class="nm">${esc(s.name)}</span><div class="track ${x.score >= 90 ? 'ok' : x.score >= SET().supplierWarn ? 'warn' : 'crit'}"><i style="width:${x.score}%"></i></div><span class="v">${fn(x.score, 1)}</span></div>`).join('') || '<div class="empty">امتیازی ثبت نشده</div>'}</div>`, `<a class="btn sm" href="#purchase">خرید</a>`);

  // activity feed
  const feed = [
    ...entriesOf('ledger_prod').map(e => ({ d: e.date, t: e.ts || 0, txt: `${esc(I.wk[e.workerId]?.name || '')}: ${fn(e.qty)} قطعه — ${esc(stageLabel(e.stageId))}` })),
    ...entriesOf('ledger_fg').map(e => ({ d: e.date, t: e.ts || 0, txt: `${e.type === 'out' ? 'تحویل' : e.type === 'in' ? 'ورود به انبار' : 'اصلاح'} ${fn(e.qty)} ${esc(I.prod[e.productId]?.name || '')}${e.customer ? ' به ' + esc(e.customer) : ''}` })),
    ...entriesOf('ledger_eq').filter(e => e.type !== 'run').map(e => ({ d: e.date, t: e.ts || 0, txt: `${e.type === 'pm' ? 'PM' : 'تعمیر'} ${esc(I.die[e.dieId]?.name || I.press[e.pressId]?.name || '')}${e.note ? ' — ' + esc(e.note) : ''}` })),
    ...Object.values(S.po).flatMap(po => (po.receipts || []).map(r => ({ d: r.date, t: r.ts || 0, txt: `رسید ${fn(r.qty, 1)} ${esc(I.mat[po.materialId]?.unit || '')} ${esc(I.mat[po.materialId]?.name || po.materialLabel || '')} از ${esc(I.sup[po.supplierId]?.name || '')}` }))),
  ].filter(x => x.d).sort((a, b) => b.d.localeCompare(a.d) || b.t - a.t).slice(0, 9);
  const feedCard = card('آخرین رویدادها', '', `<div class="feed-list">${feed.map(f => `<div class="feed-item"><time>${fd(f.d)}</time><span>${f.txt}</span></div>`).join('') || '<div class="empty">رویدادی ثبت نشده</div>'}</div>`);

  return `${kpis}
  <div class="grid g-dash">${alerts}<div class="grid">${flow}${chartCard}</div></div>
  <div class="grid g3">${matCard}${eqCard}${supCard}</div>
  <div class="grid g2">${soCard}${feedCard}</div>`;
};

/* ---------- production flow ---------- */
VIEWS.flow = D => {
  const I = idx();
  const allW = Object.values(D.wip).filter(x => x > 0); const hot = allW.length ? Math.max(...allW) * 0.6 : Infinity;
  const stageBox = s => {
    const x = D.stg[s.id] || {}; const w = D.wip[s.id];
    const die = s.dieId ? I.die[s.dieId] : null;
    const cls = w != null && w < 0 ? 'bad' : '';
    return `<div class="stg-box ${cls}"><span class="nm" title="${esc(s.name)}">${esc(s.name)}</span><span class="mc">${esc(die ? die.name : s.machine || '—')}</span><span class="out"><b>${fn(x.mOut || 0)}</b> <span class="muted">این ماه</span></span><span class="mc">کل: ${fn(x.out || 0)}${x.mScr ? ' · ضایعات ' + fn(x.mScr) : ''}</span></div>`;
  };
  const wipChip = w => w == null ? '' : `<span class="wip ${w < 0 ? 'bad' : w === 0 ? 'z' : w >= hot ? 'hot' : ''}" title="قطعه در انتظار مرحله بعد">${fn(w)}</span>`;
  const cards = activeProducts().map(p => {
    const lines = (p._lines || []).filter(L => L.stages?.length);
    if (!lines.length) return card(esc(p.name), 'مسیر تولید تعریف نشده', `<div class="empty">برای این محصول مرحله‌ای تعریف نشده است. <a href="#settings">تعریف مسیر</a></div>`);
    const body = lines.map(L => {
      const st = L.stages.map((s, i) => `<div class="stg">${stageBox(s)}</div>${i < L.stages.length - 1 || L.kind === 'comp' ? `<div class="arrow">${wipChip(D.wip[s.id])}</div>` : ''}`).join('');
      const feed = L.kind === 'comp' ? `<div class="feed">← ${esc(I.stage[L.feedsInto]?.name || '؟')} (${fn(L.perUnit)} عدد در هر ${esc(p.name)})</div>` : '';
      const tail = L.kind === 'main' ? `<span class="fg-chip">انبار محصول: ${fn(D.fg[p.id]?.stock)}</span>` : '';
      return `<div class="line"><div class="line-h"><b>${esc(L.name)}</b><small>${L.kind === 'comp' ? 'زیرمونتاژ · ×' + toFa(L.perUnit) : p.kind === 'assembly' ? 'پس از مونتاژ' : 'مسیر خطی'}</small>${feed}</div><div class="stages">${st}${tail}</div></div>`;
    }).join('');
    const wipTotal = sum(Object.entries(D.wip).filter(([k, v]) => I.stage[k]?.product.id === p.id && v > 0), ([, v]) => v);
    return card(esc(p.name), `${p.kind === 'assembly' ? 'محصول مونتاژی' : 'محصول خطی'} · ${esc(p.customer || '')} · کل قطعات در جریان: ${fn(wipTotal)}`, `<div class="flow-product">${body}</div>`, `<button class="btn sm" data-act="newReport" data-p="${p.id}">ثبت گزارش</button>`);
  }).join('');
  return `<div class="page-intro"><p>هر کادر یک مرحله تولید است با تعداد تولید ماه جاری. عدد روی فلش‌ها قطعاتی است که مرحله قبل تحویل داده و هنوز وارد مرحله بعد نشده (کار در جریان). در محصولات مونتاژی، زیرمونتاژها با ضریب مصرف به مرحله مونتاژ یا جوش تغذیه می‌شوند.</p></div>
  ${D.prodCount ? '' : `<div class="note">هنوز گزارش روزانه‌ای ثبت نشده؛ اعداد با اولین گزارش‌ها پر می‌شوند. آمار خرداد ۱۴۰۵ منتقل‌شده از اکسل در «برنامه ماهانه» (ماه خرداد) قابل مشاهده است.</div>`}
  ${cards}`;
};

/* ---------- daily reports ---------- */
VIEWS.reports = D => {
  const I = idx(), f = S.f;
  let rows = monthEntries('ledger_prod', S.month).slice();
  if (f.worker) rows = rows.filter(e => e.workerId === f.worker);
  if (f.product) rows = rows.filter(e => I.stage[e.stageId]?.product.id === f.product);
  rows.sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  const byDate = {}; rows.forEach(e => (byDate[e.date] || (byDate[e.date] = [])).push(e));
  const body = Object.entries(byDate).map(([d, list]) => `<tr class="group"><td colspan="9">${fd(d)} — ${fn(new Set(list.map(e => e.workerId)).size)} نفر · ${fn(sum(list, e => e.qty))} قطعه · ${fn(sum(list, e => e.hours), 1)} ساعت</td></tr>` + list.map(e => {
    const s = I.stage[e.stageId]; const std = (e.qty || 0) * (s?.stdMin || 0) / 60; const eff = e.hours ? std / e.hours * 100 : null;

};
/* ---------- monthly plan ---------- */
VIEWS.plan = D => {
  const I = idx(), P = D.plan;
  if (!P) return `<div class="page-intro"><p>برنامه ماهانه تعداد محصول نهایی هر محصول را مشخص می‌کند. سامانه نیاز هر مرحله (با ضریب زیرمونتاژ)، ساعت‌نفر لازم و درصد تحقق را از گزارش‌های روزانه حساب می‌کند.</p></div>
    ${card('برنامه ' + esc(monthLabel(S.month)), '', `<div class="empty"><b>برای این ماه برنامه‌ای ثبت نشده</b><br><button class="btn pri" data-act="editPlan">ثبت برنامه ${esc(monthLabel(S.month))}</button></div>`)}`;
  const cap = (P.staff || 0) * (P.workDays || 0) * (P.dayHours || 0);
  const reqRows = [];
  (P.items || []).forEach(it => {
    const p = I.prod[it.productId]; if (!p) return;
    (p._lines || []).forEach(L => (L.stages || []).forEach(s => {
      const need = it.qty * (L.perUnit || 1);
      const imp = P.importedStages?.[s.id];
      const act = (D.stg[s.id]?.mOut || 0) || (imp?.actual || 0);
      reqRows.push({ p, L, s, need, act, hrs: need * (s.stdMin || 0) / 60, imp: !D.stg[s.id]?.mOut && imp });
    }));
  });
  const reqH = sum(reqRows, r => r.hrs);
  const loadSev = !cap ? 'unknown' : reqH > cap ? 'crit' : reqH > cap * 0.9 ? 'warn' : 'ok';
  const top = `<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">
    <div class="kpi ${D.planAch == null ? '' : D.planAch >= 90 ? 'ok' : D.planAch >= 70 ? 'warn' : 'crit'}"><span class="lbl">تحقق کل برنامه</span><span class="val">${pct(D.planAch)}</span>${meter(D.planAch, '')}</div>
    <div class="kpi"><span class="lbl">ساعت‌نفر لازم طبق برنامه</span><span class="val">${fn(reqH)}</span><span class="foot">جمع زمان استاندارد همه مراحل</span></div>
    <div class="kpi ${loadSev}"><span class="lbl">ظرفیت نیروی انسانی</span><span class="val">${fn(cap)}</span><span class="foot">${fn(P.staff)} نفر × ${fn(P.workDays)} روز × ${fn(P.dayHours)} ساعت</span></div>
    <div class="kpi ${loadSev}"><span class="lbl">بار کاری</span><span class="val">${cap ? pct(reqH / cap * 100) : '—'}</span><span class="foot">${loadSev === 'crit' ? 'بیش از ظرفیت: اضافه‌کار یا نیروی جدید لازم است' : 'در محدوده ظرفیت'}</span></div>
  </div>`;
  const prodT = `<div class="tbl-wrap"><table><thead><tr><th>محصول</th><th class="n">برنامه</th><th class="n">تولید نهایی</th><th class="n">تحویل ماه</th><th class="n">تحقق</th><th class="n">ساعت استاندارد هر عدد</th></tr></thead><tbody>${D.planRows.map(r => `<tr><td>${esc(r.p.name)}</td><td class="n">${fn(r.qty)}</td><td class="n">${fn(r.done)}</td><td class="n">${fn(D.fg[r.p.id]?.mOut)}</td><td class="n">${pill(r.pct >= 90 ? 'ok' : r.pct >= 70 ? 'warn' : 'crit', pct(r.pct))}</td><td class="n">${fn(r.stdPer, 2)}</td></tr>`).join('')}</tbody></table></div>`;
  const stT = `<div class="tbl-wrap"><table><thead><tr><th>محصول</th><th>مرحله</th><th class="n">نیاز</th><th class="n">تولید</th><th class="n">تحقق</th><th class="n">ساعت‌نفر لازم</th></tr></thead><tbody>${reqRows.map(r => { const p = r.need ? r.act / r.need * 100 : null; return `<tr><td>${esc(r.p.name)}</td><td>${esc((r.L.kind === 'comp' ? r.L.name + ' › ' : '') + r.s.name)}${r.imp ? ' <span class="tag">اکسل</span>' : ''}</td><td class="n">${fn(r.need)}</td><td class="n">${fn(r.act)}</td><td class="n"><span class="mini-bar ${p >= 90 ? 'ok' : p >= 70 ? 'warn' : 'crit'}"><i style="width:${clamp(p || 0, 0, 100)}%"></i></span> ${pct(p)}</td><td class="n">${fn(r.hrs, 1)}</td></tr>`; }).join('')}</tbody></table></div>`;
  return `<div class="page-intro"><p>${P.note ? esc(P.note) : 'درصد تحقق بر اساس خروجی آخرین مرحله هر محصول محاسبه می‌شود.'}</p><span class="sp"></span><button class="btn" data-act="editPlan">ویرایش برنامه</button></div>
  ${top}${card('برنامه محصولات', esc(monthLabel(S.month)), prodT)}${card('نیاز و عملکرد هر مرحله', 'نیاز = برنامه × ضریب مصرف زیرمونتاژ', stT)}`;
};

};

  return `<div class="page-intro"><p>امتیاز هر محموله با فرمول فرم F-PC-05-1 محاسبه می‌شود: هزینه حمل ×۰٫۲ + کیفیت ×۰٫۳ + تحویل به‌موقع ×۰٫۲ + انطباق حجم ×۰٫۱ + عدم اخلال ×۰٫۲. رسیدها مستقیم به موجودی انبار اضافه می‌شوند.</p><span class="sp"></span><button class="btn pri" data-act="editPO">+ سفارش خرید جدید</button></div>

/* ================= modal ================= */
let MODAL = null;
function openModal({ title, body, submit = 'ثبت', onSubmit, foot = '', onMount, wide }) {
  MODAL = { onSubmit, onMount };
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = `<div class="err" id="mErr" hidden></div>` + body;
  $('#mFoot').innerHTML = (onSubmit ? `<button type="submit" class="btn pri" id="mSubmit">${esc(submit)}</button>` : '') + `<button type="button" class="btn" data-act="closeModal">${onSubmit ? 'انصراف' : 'بستن'}</button><span style="flex:1"></span>${foot}`;
  const dlg = $('#modal'); dlg.style.width = wide ? 'min(1040px,calc(100vw - 24px))' : '';
  if (!dlg.open) dlg.showModal();
  onMount && onMount($('#mBody'));
  setTimeout(() => { const f = $('#mBody').querySelector('input:not([type=hidden]),select'); f && f.focus(); }, 30);
}
function closeModal() { const d = $('#modal'); if (d.open) d.close(); MODAL = null; }
function mErr(msg) { const e = $('#mErr'); e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: 'nearest' }); }
$('#mform').addEventListener('submit', async ev => {
  ev.preventDefault();
  if (!MODAL?.onSubmit) return;
  const btn = $('#mSubmit'); btn.disabled = true; $('#mErr').hidden = true;
  try { const msg = await MODAL.onSubmit(new FormData($('#mform')), $('#mBody')); closeModal(); toast(msg || 'ثبت شد'); }
  catch (e) { mErr(typeof e === 'string' ? e : (e?.message || 'ثبت انجام نشد')); btn.disabled = false; }
});
$('#modal').addEventListener('cancel', () => { MODAL = null; });

const inp = (name, val = '', attrs = '') => `<input type="text" id="f_${name}" name="${name}" value="${esc(val)}" ${attrs}>`;
const ninp = (name, val = '', attrs = '') => `<input type="text" inputmode="decimal" id="f_${name}" name="${name}" value="${val === '' || val == null ? '' : esc(val)}" ${attrs}>`;

      const rows = [];

        const i = el.dataset.row; const stageId = fv(fd, 's_' + i); const qty = fnum(fd, 'q_' + i), rework = fnum(fd, 'rw_' + i), scrap = fnum(fd, 'sc_' + i), hours = fnum(fd, 'h_' + i);
        if (!stageId && !qty && !hours) return;
        if (!stageId) throw 'برای هر ردیف مرحله تولید را انتخاب کنید.';
        if (qty < 0 || scrap < 0 || rework < 0 || hours < 0) throw 'اعداد نمی‌توانند منفی باشند.';
        if (!qty && !scrap && !rework) throw 'تعداد تولید را وارد کنید.';
        if (hours > 24) throw 'ساعت کار در یک ردیف بیش از ۲۴ است.';
        rows.push({ id: edit?.id || uid(), ts: Date.now(), date, workerId, stageId, qty, rework, scrap, hours, note: fv(fd, 'note') });
      });
      if (!rows.length) throw 'حداقل یک ردیف تولید وارد کنید.';
      const tot = sum(rows, r => r.hours); if (tot > 16) throw 'جمع ساعت کار این کارگر بیش از ۱۶ ساعت است.';
      if (edit) { await replaceLedger('ledger_prod', monthOf(edit.date), rows[0]); return 'گزارش ویرایش شد'; }
      await appendLedger('ledger_prod', date, rows);
      if (monthOf(date) !== S.month) S.month = monthOf(date);
      return `گزارش ${rows.length > 1 ? toFa(rows.length) + ' مرحله ' : ''}ثبت شد`;
    }
  });
}

  const stageOpts = pid => '<option value="">— (بدون کسر خودکار)</option>' + (idx().prod[pid]?._lines || []).flatMap(L => (L.stages || []).map(s => `<option value="${s.id}" ${s.id === m.stageId ? 'selected' : ''}>${esc((L.kind === 'comp' ? L.name + ' › ' : '') + s.name)}</option>`)).join('');
  openModal({ title: id ? 'ویرایش ماده اولیه' : 'ماده اولیه جدید',
    body: `<div class="fgrid">${F('نام', inp('name', m.name || ''))}${F('واحد انبار', inp('unit', m.unit || ''))}${F('محصول', sel('prod', selOpts(S.master.products, m.productId, '—'), 'data-matprod="1"'))}${F('مرحله مصرف', sel('stage', stageOpts(m.productId)))}</div>
      <div class="fgrid">${F('ضریب مصرف', ninp('per', m.perProduct ?? ''), 'مقدار ماده برای یک محصول نهایی')}${F('مانده اول دوره', ninp('opening', m.opening ?? 0))}${F('تاریخ مانده', dinp('openingDate', m.openingDate || TODAY))}${F('قیمت واحد (تومان)', ninp('price', m.price ?? 0))}</div>
      <div class="fgrid">${F('نقطه سفارش (تعداد محصول)', ninp('ro', m.reorderProducts ?? 0))}${F('حداکثر موجودی (محصول)', ninp('mx', m.maxProducts ?? 0))}${F('زمان تامین (ماه)', ninp('lead', m.leadMonths ?? 1))}</div>`,
    onMount: b => b.querySelector('[data-matprod]').addEventListener('change', e => { $('#f_stage').innerHTML = stageOpts(e.target.value); }),
    onSubmit: async fd => { const name = fv(fd, 'name'); if (!name) throw 'نام را وارد کنید.'; await upsertMaster('materials', { ...m, id: id || 'm_' + uid(), name, unit: fv(fd, 'unit'), productId: fv(fd, 'prod') || null, stageId: fv(fd, 'stage') || null, perProduct: fnum(fd, 'per'), opening: fnum(fd, 'opening'), openingDate: needDate(fd, 'openingDate'), price: fnum(fd, 'price'), reorderProducts: fnum(fd, 'ro'), maxProducts: fnum(fd, 'mx'), leadMonths: fnum(fd, 'lead'), active: true }); return 'ذخیره شد'; } });
}
async function saveEquipment(fnc) { await mutate('master/equipment', d => fnc({ presses: [...(d.presses || [])], dies: [...(d.dies || [])] })); }
function openDie(id) {
  const d = id ? idx().die[id] : { pmEvery: 7000, life: 0, baseStrokes: 0 };
  openModal({ title: id ? 'ویرایش قالب' : 'قالب جدید', body: `<div class="fgrid">${F('نام قالب', inp('name', d.name || ''))}${F('پرس', sel('press', selOpts(S.master.equipment.presses || [], d.pressId, '—')))}${F('محصول', sel('prod', selOpts(S.master.products, d.productId, '—')))}${F('سازنده', inp('maker', d.maker || ''))}</div>
    <div class="fgrid">${F('تناوب PM (ضرب)', ninp('pm', d.pmEvery))}${F('عمر قالب (ضرب)', ninp('life', d.life), '۰ = نامشخص')}${F('ضرب پایه', ninp('base', d.baseStrokes), 'کارکرد قبل از شروع ثبت در سامانه')}</div><div class="note">برای شمارش خودکار ضرب، قالب را در «ویرایش مسیر» محصول به مرحله مربوط وصل کنید.</div>`,
    onSubmit: async fd => { const name = fv(fd, 'name'); if (!name) throw 'نام را وارد کنید.'; const it = { ...d, id: id || 'd_' + uid(), name, pressId: fv(fd, 'press') || null, productId: fv(fd, 'prod') || null, maker: fv(fd, 'maker'), pmEvery: fnum(fd, 'pm'), life: fnum(fd, 'life'), baseStrokes: fnum(fd, 'base') };
      await saveEquipment(E => { const i = E.dies.findIndex(x => x.id === it.id); i >= 0 ? E.dies[i] = it : E.dies.push(it); return E; }); return 'ذخیره شد'; } });
}
function openPress(id) {
  const p = id ? idx().press[id] : { pmEveryDays: 30, baseStrokes: 0, baseHours: 0 };
  openModal({ title: id ? 'ویرایش پرس' : 'پرس جدید', body: `<div class="fgrid">${F('نام', inp('name', p.name || ''))}${F('نوع', inp('type', p.type || ''))}${F('تناوب PM (روز)', ninp('pm', p.pmEveryDays))}${F('ضرب پایه', ninp('bs', p.baseStrokes))}${F('ساعت پایه', ninp('bh', p.baseHours))}${F('آخرین PM (پایه)', dinp('lastPm', p.lastPmDate || ''))}</div>`,
    onSubmit: async fd => { const name = fv(fd, 'name'); if (!name) throw 'نام را وارد کنید.'; const it = { ...p, id: id || 'pr_' + uid(), name, type: fv(fd, 'type'), pmEveryDays: fnum(fd, 'pm'), baseStrokes: fnum(fd, 'bs'), baseHours: fnum(fd, 'bh'), lastPmDate: normDate(fv(fd, 'lastPm')) };
      await saveEquipment(E => { const i = E.presses.findIndex(x => x.id === it.id); i >= 0 ? E.presses[i] = it : E.presses.push(it); return E; }); return 'ذخیره شد'; } });
}
function openRules() {
  const s = SET();
  const R = [['pmWarnPct', 'هشدار PM قالب/پرس (٪ تناوب)'], ['lifeWarnPct', 'هشدار عمر قالب (٪)'], ['prodWarnPct', 'حد بهره‌وری پرسنل (٪)'], ['scrapWarnPpm', 'حد ضایعات مرحله (ppm)'], ['supplierWarn', 'حد امتیاز تامین‌کننده'], ['soWarnDays', 'هشدار سفارش مشتری (روز مانده)'], ['poLateCritDays', 'دیرکرد بحرانی خرید (روز)'], ['planLagPct', 'عقب‌ماندگی مجاز از برنامه (٪)']];
  openModal({ title: 'آستانه‌های قواعد کنترلی', body: `<div class="fgrid">${R.map(([k, l]) => F(l, ninp(k, s[k]))).join('')}</div><label class="inline"><input type="checkbox" name="auto" id="f_auto" ${s.autoConsume ? 'checked' : ''}> کسر خودکار مصرف مواد از گزارش روزانه</label>`,
    onSubmit: async fd => { const o = Object.fromEntries(R.map(([k]) => [k, fnum(fd, k)])); o.autoConsume = fd.get('auto') === 'on'; await mutate('master/settings', d => ({ ...d, ...o })); return 'آستانه‌ها ذخیره شد'; } });
}

/* ---------- product & routing editor ---------- */
let RE = null;
function openProduct(id) {
  const p = id ? idx().prod[id] : null;
  RE = p ? JSON.parse(JSON.stringify({ id: p.id, name: p.name, code: p.code, customer: p.customer, kind: p.kind, components: p.components || [], stages: p.stages || [], fgOpening: p.fgOpening || 0, fgOpeningDate: p.fgOpeningDate || TODAY, monthlyForecast: p.monthlyForecast || 0, minStock: p.minStock || 0, active: p.active !== false })) : { id: 'p_' + uid(), name: '', code: '', customer: '', kind: 'linear', components: [], stages: [], fgOpening: 0, fgOpeningDate: TODAY, monthlyForecast: 0, minStock: 0, active: true, _new: true };
  openModal({ title: p ? 'مسیر تولید ' + p.name : 'محصول جدید', wide: true, body: `<div id="reBody">${reHtml()}</div>`, submit: 'ذخیره محصول',
    onSubmit: async () => {
      reSync(); if (!RE.name) throw 'نام محصول را وارد کنید.';
      const all = [...RE.components.flatMap(c => c.stages), ...RE.stages]; if (all.some(s => !s.name)) throw 'نام همه مراحل را وارد کنید.';
      if (RE.kind === 'assembly' && RE.components.some(c => !c.feedsInto)) throw 'برای هر زیرمونتاژ مرحله مصرف‌کننده را انتخاب کنید.';
      const out = { ...RE }; delete out._new; if (out.kind === 'linear') out.components = [];
      await upsertMaster('products', out); return 'محصول ذخیره شد';
    } });
}
function stageRowHtml(path, s, i) {
  return `<div class="srow" data-path="${path}.${i}"><span class="muted">${toFa(i + 1)}</span><input type="text" data-k="name" value="${esc(s.name)}" placeholder="نام مرحله" aria-label="نام مرحله"><input type="text" data-k="stdMin" value="${esc(s.stdMin ?? '')}" placeholder="دقیقه" title="زمان استاندارد (نفر-دقیقه برای یک قطعه)" inputmode="decimal"><input type="text" data-k="machine" value="${esc(s.machine || '')}" placeholder="دستگاه"><select data-k="dieId" title="قالب (برای شمارش ضرب)">${selOpts(S.master.equipment.dies || [], s.dieId, 'بدون قالب')}</select><input type="text" data-k="openingWip" value="${esc(s.openingWip || 0)}" title="کار در جریان اول دوره" inputmode="numeric"><span class="inline" style="gap:2px"><button type="button" class="btn sm ghost" data-act="reMove" data-path="${path}" data-i="${i}" data-d="-1" title="انتقال به قبل">▲</button><button type="button" class="btn sm ghost danger" data-act="reDel" data-path="${path}" data-i="${i}" title="حذف مرحله">✕</button></span></div>`;
}
function reHtml() {
  const stagesHdr = `<div class="srow small muted"><span>#</span><span>مرحله</span><span>زمان استاندارد</span><span>دستگاه</span><span>قالب</span><span>WIP اول</span><span></span></div>`;
  const feedOpts = sel => [...RE.components.flatMap(c => c.stages.map(s => ({ id: s.id, name: c.name + ' › ' + s.name }))), ...RE.stages.map(s => ({ id: s.id, name: s.name }))].map(o => `<option value="${o.id}" ${o.id === sel ? 'selected' : ''}>${esc(o.name)}</option>`).join('');
  return `<div class="fgrid">${F('نام محصول', `<input type="text" data-top="name" value="${esc(RE.name)}">`)}${F('کد', `<input type="text" data-top="code" value="${esc(RE.code || '')}">`)}${F('مشتری', `<input type="text" data-top="customer" value="${esc(RE.customer || '')}">`)}${F('نوع', `<select data-top="kind"><option value="linear" ${RE.kind === 'linear' ? 'selected' : ''}>خطی (مراحل پشت سر هم)</option><option value="assembly" ${RE.kind === 'assembly' ? 'selected' : ''}>مونتاژی (چند زیرمونتاژ)</option></select>`)}</div>
  <div class="fgrid">${F('موجودی اول دوره', `<input type="text" data-top="fgOpening" value="${esc(RE.fgOpening)}">`)}${F('پیش‌بینی فروش ماهانه', `<input type="text" data-top="monthlyForecast" value="${esc(RE.monthlyForecast)}">`)}${F('حداقل موجودی', `<input type="text" data-top="minStock" value="${esc(RE.minStock)}">`)}${F('وضعیت', `<select data-top="active"><option value="1">فعال</option><option value="0" ${RE.active ? '' : 'selected'}>غیرفعال</option></select>`)}</div>
  <div class="route-edit">
    ${RE.kind === 'assembly' ? RE.components.map((c, ci) => `<div class="route-line" data-comp="${ci}"><div class="inline"><b>زیرمونتاژ</b><input type="text" data-ck="name" value="${esc(c.name)}" style="width:170px" aria-label="نام زیرمونتاژ"><label class="small">تعداد در هر محصول</label><input type="text" data-ck="perUnit" value="${esc(c.perUnit)}" style="width:70px"><label class="small">مصرف در مرحله</label><select data-ck="feedsInto" style="width:auto">${feedOpts(c.feedsInto)}</select><span style="flex:1"></span><button type="button" class="btn sm ghost danger" data-act="reDelComp" data-i="${ci}">حذف زیرمونتاژ</button></div>${stagesHdr}${c.stages.map((s, i) => stageRowHtml('c' + ci, s, i)).join('')}<div><button type="button" class="btn sm" data-act="reAdd" data-path="c${ci}">+ مرحله</button></div></div>`).join('') + `<div><button type="button" class="btn sm" data-act="reAddComp">+ زیرمونتاژ</button></div>` : ''}
    <div class="route-line"><b>${RE.kind === 'assembly' ? 'خط مونتاژ نهایی (از مونتاژ تا بسته‌بندی)' : 'مراحل تولید به ترتیب'}</b>${stagesHdr}${RE.stages.map((s, i) => stageRowHtml('m', s, i)).join('')}<div><button type="button" class="btn sm" data-act="reAdd" data-path="m">+ مرحله</button></div></div>
  </div>
  <div class="note">زمان استاندارد = نفر-دقیقه لازم برای یک قطعه در آن مرحله (همان ستون «زمان تولید یک قطعه» در فایل برنامه‌ریزی). آخرین مرحله خط اصلی، محصول را وارد انبار محصول می‌کند.</div>`;
}
function reSync() {
  const b = $('#reBody'); if (!b || !RE) return;
  b.querySelectorAll('[data-top]').forEach(el => { const k = el.dataset.top; let v = el.value; if (['fgOpening', 'monthlyForecast', 'minStock'].includes(k)) v = num(v); if (k === 'active') v = v === '1'; RE[k] = v; });
  b.querySelectorAll('[data-comp]').forEach(el => { const c = RE.components[+el.dataset.comp]; el.querySelectorAll('[data-ck]').forEach(i => { c[i.dataset.ck] = i.dataset.ck === 'perUnit' ? num(i.value) || 1 : i.value; }); });
  b.querySelectorAll('.srow[data-path]').forEach(el => { const [path, i] = el.dataset.path.split('.'); const arr = path === 'm' ? RE.stages : RE.components[+path.slice(1)].stages; const s = arr[+i]; el.querySelectorAll('[data-k]').forEach(f => { const k = f.dataset.k; s[k] = ['stdMin', 'openingWip'].includes(k) ? num(f.value) : (k === 'dieId' ? (f.value || null) : f.value); }); });
}
function reRender() { $('#reBody').innerHTML = reHtml(); }
function reArr(path) { return path === 'm' ? RE.stages : RE.components[+path.slice(1)].stages; }
const rePrefix = path => path === 'm' ? RE.id + '_m' : RE.components[+path.slice(1)].id;

/* ================= events ================= */
document.addEventListener('click', async ev => {
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, D = S.ready.has('master') ? derive() : null;
  const needDb = () => { if (!S.db) { toast('اتصال به پایگاه داده برقرار نیست'); return false; } return true; };
  switch (act) {
    case 'menu': $('#side').classList.toggle('open'); break;
    case 'month': S.month = shiftMonth(S.month, -(+a.dataset.d)); bump(); break;
    case 'print': window.print(); break;
    case 'demoReset': confirmBox('بازگشت به داده‌های اولیه', 'همه ثبت‌ها و تغییراتی که در این مرورگر انجام شده پاک می‌شود و داده‌های اکسل دوباره بارگذاری می‌شود.', async () => { S.demoReset && S.demoReset(); }, 'بازگشت'); break;
    case 'closeModal': closeModal(); break;
    case 'setF': S.f[a.dataset.k] = a.dataset.v; bump(); break;
    case 'newReport': if (needDb()) openReport({ productId: a.dataset.p }); break;
    case 'editReport': { const e = entriesOf('ledger_prod').find(x => x.id === a.dataset.id); if (e) openReport({}, e); break; }
    case 'addRow': { const i = ROWN++; $('#rrows').insertAdjacentHTML('beforeend', reportRow(i, { productId: $$('#rrows [data-prodsel]').pop()?.value })); break; }
    case 'rmRow': { const rows = $$('#rrows .rrow'); if (rows.length > 1) a.closest('.rrow').remove(); break; }
    case 'delEntry': { const { k, m, id } = a.dataset; confirmBox('حذف ردیف', 'این ردیف برای همه کاربران حذف می‌شود و محاسبات به‌روز خواهد شد.', () => removeLedger(k, m, id)); break; }
    case 'editPlan': if (needDb()) openPlan(); break;
    case 'matMove': if (needDb()) openMatMove(a.dataset.id); break;
    case 'kardex': openKardex(a.dataset.id); break;
    case 'fgMove': if (needDb()) openFgMove(a.dataset.p, a.dataset.t || 'out', a.dataset.so); break;
    case 'editPO': if (needDb()) openPO(a.dataset.id); break;
    case 'delPO': { const id = a.dataset.id; confirmBox('حذف سفارش خرید', 'سفارش و رسیدهای آن حذف می‌شود و موجودی انبار اصلاح خواهد شد.', () => delDoc('po/' + id)); break; }
    case 'receive': if (needDb()) openReceive(a.dataset.id); break;
    case 'editSO': if (needDb()) openSO(a.dataset.id); break;
    case 'delSO': { const id = a.dataset.id; confirmBox('حذف سفارش مشتری', 'سفارش حذف می‌شود؛ تحویل‌های ثبت‌شده در انبار محصول باقی می‌مانند.', () => delDoc('so/' + id)); break; }
    case 'eqLog': if (needDb()) openEqLog(a.dataset.t, a.dataset.die, a.dataset.press); break;
    case 'editWorker': if (needDb()) openWorker(a.dataset.id); break;
    case 'editSupplier': if (needDb()) openSupplier(a.dataset.id); break;
    case 'editMaterial': if (needDb()) openMaterial(a.dataset.id); break;
    case 'editDie': if (needDb()) openDie(a.dataset.id); break;
    case 'editPress': if (needDb()) openPress(a.dataset.id); break;
    case 'editRules': if (needDb()) openRules(); break;
    case 'editProduct': if (needDb()) openProduct(a.dataset.id); break;
    case 'reAdd': { reSync(); const arr = reArr(a.dataset.path); arr.push({ id: rePrefix(a.dataset.path) + '_' + uid().slice(-5), name: '', stdMin: 0, machine: '', dieId: null, piecesPerStroke: 1, openingWip: 0 }); reRender(); break; }
    case 'reDel': { reSync(); const arr = reArr(a.dataset.path); const s = arr[+a.dataset.i]; if (D && D.stg[s.id]?.out) { toast('برای این مرحله گزارش ثبت شده؛ ابتدا گزارش‌ها را حذف کنید'); break; } arr.splice(+a.dataset.i, 1); reRender(); break; }
    case 'reMove': { reSync(); const arr = reArr(a.dataset.path), i = +a.dataset.i; if (i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; reRender(); } break; }
    case 'reAddComp': { reSync(); RE.components.push({ id: RE.id + '_c' + uid().slice(-5), name: 'زیرمونتاژ جدید', perUnit: 1, feedsInto: RE.stages[0]?.id || '', stages: [] }); reRender(); break; }
    case 'reDelComp': { reSync(); RE.components.splice(+a.dataset.i, 1); reRender(); break; }
    case 'csvReports': { const I = idx(); exportCSV('daily-reports-' + S.month, ['تاریخ', 'کارگر', 'محصول', 'مرحله', 'سالم', 'دوباره‌کاری', 'ضایعات', 'ساعت', 'توضیح'], monthEntries('ledger_prod', S.month).map(e => [e.date, I.wk[e.workerId]?.name, I.stage[e.stageId]?.product.name, I.stage[e.stageId]?.name, e.qty, e.rework, e.scrap, e.hours, e.note])); break; }
    case 'csvMat': { const I = idx(); exportCSV('materials-' + TODAY.replace(/\//g, '-'), ['ماده', 'واحد', 'محصول', 'موجودی', 'مصرف ماه', 'در راه', 'کافی برای (محصول)', 'روز پوشش'], S.master.materials.map(m => { const x = D.mat[m.id]; return [m.name, m.unit, I.prod[m.productId]?.name || '', x.stock.toFixed(2), x.consM.toFixed(2), x.onOrder, x.cover == null ? '' : Math.round(x.cover), x.days == null ? '' : Math.round(x.days)]; })); break; }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.f) { S.f[t.dataset.f] = t.value; bump(); return; }
  if (t.dataset.prodsel != null) { const i = t.dataset.prodsel; $('#f_s_' + i).innerHTML = stageOptions(t.value); return; }
  if (t.dataset.top === 'kind' && RE) { reSync(); if (RE.kind === 'assembly' && !RE.components.length) RE.components.push({ id: RE.id + '_c' + uid().slice(-5), name: 'زیرمونتاژ ۱', perUnit: 1, feedsInto: RE.stages[0]?.id || '', stages: [] }); reRender(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#side').classList.remove('open'); });

boot();
</script>

</body>
